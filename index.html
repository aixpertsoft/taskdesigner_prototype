<title>Task Request Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="app.css">

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v7a3 3 0 0 0 3 3h5"/><circle cx="4" cy="13" r="1.8"/><circle cx="4" cy="3" r="1.8" /><circle cx="13" cy="12" r="1.8"/></svg>
      </span>
      AixBOMS
      <span class="sub" id="brandsub">Task Requests</span>
    </div>
    <!-- The demo is two applications in one shell: the end user's runtime and the
         administrator's designer. One shell on purpose — state is in-memory, so a
         designer edit is live in the runtime the moment you switch. -->
    <div class="seg" id="modeswitch" role="group" aria-label="Runtime or designer"></div>
    <nav class="topnav" id="topnav"></nav>
    <div class="spacer"></div>
    <div class="userswitch" id="userswitch">
      <span>Viewing as</span>
      <div class="avatars" id="avatars" role="group" aria-label="Switch demo user"></div>
    </div>
    <div class="tipwrap">
      <button class="iconbtn accent" id="tipbtn" data-act="toggle-tip" aria-expanded="false"
              title="What to try in this prototype" aria-label="What to try in this prototype">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.6h4M6.8 14.5h2.4"/><path d="M8 1.5a4.4 4.4 0 0 0-2.6 7.9c.4.3.6.8.6 1.2h4c0-.4.2-.9.6-1.2A4.4 4.4 0 0 0 8 1.5Z"/></svg>
      </button>
      <div id="tip"></div>
    </div>
    <button class="iconbtn" id="themebtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1" stroke-linecap="round"/></svg>
    </button>
    <button class="iconbtn" id="resetbtn" title="Reset the prototype" aria-label="Reset the prototype">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.9"/><path d="M13.5 2v3.2h-3.2"/></svg>
    </button>
  </header>

  <main class="main" id="screen"></main>

  <div class="footnote">
    <b>Clickable prototype, not the product.</b> The approval and execution rules are real logic;
    signing and sending are simulated. Nothing is saved.
  </div>
</div>

<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================ state ============================ */
let S;

/* One worked example: the notification a network operator has to send customers
   before planned maintenance. Four steps — a person drafts it, the server
   fingerprints the exact wording, an administrator approves that wording, the
   server sends it and records what the mail server answered. */

/* Creating a request instantiates the request type's task flow. The step's rules
   are copied onto the task item, not referenced: a request is bound to the flow
   as it was when it was raised, and editing the template later must not change
   what an in-flight request will do. Same reasoning as definitionVersion. */
function instantiateFlow(definition, seqBase){
  let n = seqBase;
  const copy = x => JSON.parse(JSON.stringify(x));
  return (definition.taskFlow||[]).map(step=>({
    id:'ti'+(++n), def:step.taskDefinition, stepId:step.stepId, required:!!step.required,
    status:'NOT_RUN', attempts:0,
    config:copy(step.defaults||{}),
    /* runtimeConfig is the administrator half: how the engine behaves at this
       step. It sits on the item rather than in its config, so it never appears
       in the task form the requester fills in. */
    onRefusal:(step.runtimeConfig||{}).onRefusal || null,
    assignedRoles:copy((step.runtimeConfig||{}).assignedRoles||[]),
    dueBy:(step.runtimeConfig||{}).dueBy || null,
    skipWhen:copy((step.runtimeConfig||{}).skipWhen||[]),
    requires:copy((step.runtimeConfig||{}).requires||[]),
  }));
}
function seed(){
  /* The request type comes from request-types.json.js — the document the server
     would return from GET /taskrequestdefs. Its taskFlow is the ordered template
     a new request is instantiated from. */
  const definition = currentRequestType();
  const data = {};
  definition.dataParameters.forEach(p=>{ data[p.name] = p.defaultValue; });

  return {
    me:'mb',
    /* 'runtime' is the end user's app; 'designer' the administrator's. */
    mode:'runtime',
    screen:'inbox',
    /* "All open" rather than "Awaiting my approval": the one seeded request belongs
       to the starting user, so an approval-filtered inbox would open empty. */
    inboxTab:'open',
    requestTab:'tasks',
    defSection:'flow',
    flowOpen:null,
    openRequestId:'TR-2087',
    tipOpen:false, tipSeen:false, gateOpen:false,
    seq:6,
    definition,
    requests:[
      {
        id:'TR-2087', name:'Notify customers — R12 uplink switch replacement',
        requester:'mb',
        createdAt:'03.09.2026 09:14', version:3,
        data,
        /* Instantiated from the flow, exactly as a new request would be — so the
           seed cannot drift from the template it claims to come from. */
        taskItems:instantiateFlow(definition, 0),
        approvals:[
          {id:'a1', user:'kw', decision:'APPROVED', at:'03.09.2026 09:41', hash:null},
        ],
        changeRequests:[],
        comments:[
          {id:'c1', user:'mb', text:'Uplink switch in R12 gets replaced in the September window. '
            +'Customers on that switch have to be told a week in advance — this is the notification.',
           at:'03.09.2026 09:14'},
        ],
        history:[
          {at:'03.09.2026 09:14', who:'mb', text:'created this request from Maintenance Notification'},
          {at:'03.09.2026 09:41', who:'kw', text:'approved this request'},
        ],
        logs:[], workItems:[], run:null,
      },
    ],
  };
}

/* ============================ render: shell ============================ */
function render(){
  $('#avatars').innerHTML = USER_ORDER.map(id=>{
    const u=USERS[id];
    return `<button class="avatar" data-user="${id}" aria-pressed="${S.me===id}"
      title="${esc(u.name)} — ${esc(u.roles.join(', '))}">${u.initials}</button>`;
  }).join('');
  $('#brandsub').textContent = S.mode==='designer' ? 'Designer' : 'Task Requests';
  $('#modeswitch').innerHTML = [['runtime','Runtime'],['designer','Designer']]
    .map(([m,l])=>`<button class="${S.mode===m?'on':''}" data-mode="${m}"
      aria-pressed="${S.mode===m}">${l}</button>`).join('');
  $('#topnav').innerHTML = S.mode==='designer'
    ? `<button data-nav="definition" aria-current="${S.screen==='definition'}">Request type</button>
       <button data-nav="taskdefs" aria-current="${S.screen==='taskdefs'}">Task types</button>`
    : `<button data-nav="inbox" aria-current="true">Requests</button>`;
  /* Switching demo users is a runtime device; the designer is one person's tool. */
  $('#userswitch').classList.toggle('hide', S.mode==='designer');
  $('#tip').innerHTML = tipPanel();
  $('#tipbtn').setAttribute('aria-expanded', String(S.tipOpen));
  $('#tipbtn').classList.toggle('seen', S.tipSeen);
  /* A crash while building a screen must be a visible card, not a button that
     silently does nothing. The classic cause here is the Live Preview webview
     serving a cached index.html next to fresh sibling .js files — two versions
     of one program in the same page. */
  try{
    $('#screen').innerHTML =
        S.screen==='inbox'      ? viewInbox()
      : S.screen==='request'    ? viewRequest()
      : S.screen==='definition' ? viewDefinition()
      : S.screen==='taskdefs'   ? viewTaskDefs()   /* task-editor.js */
      : '';
  }catch(err){
    console.error(err);
    document.querySelector('#screen').innerHTML = `
      <div class="card" style="padding:22px;max-width:640px;margin:40px auto">
        <h1 style="margin:0 0 10px;font-size:19px">This screen crashed while rendering</h1>
        <div class="te-call mono">${esc(err && err.message || String(err))}</div>
        <p style="color:var(--ink-2);font-size:13px;margin:12px 0 0">
          If you just edited the prototype's files, the usual cause is the embedded preview serving
          a <b>cached copy of one file next to fresh copies of the others</b> — two versions of the
          same program on one page. Reload with <b>Ctrl&nbsp;+&nbsp;Shift&nbsp;+&nbsp;R</b>, or open
          it in a real browser.</p>
        <p style="color:var(--ink-3);font-size:12px;margin:8px 0 0">
          The full stack trace is in the console (F12).</p>
      </div>`;
  }
}

function tipPanel(){
  if(!S.tipOpen) return '';
  return `<div class="tip" role="dialog" aria-label="What to try">
    <h3>Try this</h3>
    <ol>
      <li>Open the request and press <b>Execute all tasks</b>. It runs step 1 and stops — a person
        has to draft the notification.</li>
      <li>You are <b>M. Browett</b> (NetOps), so it is yours. Press <b>Draft</b> and write the
        notification. The server fingerprints it, then parks again for an administrator.</li>
      <li>Switch to <b>K. Weber</b> (top right). <i>Awaiting my action</i> shows 1. Approve the
        wording — the mail sends by itself.</li>
      <li>Watch the <b>Data</b> tab fill in as it goes: subject, text, fingerprint, delivery status.</li>
      <li>To see a failure, put an address at <span class="mono">@invalid.example</span> in the
        recipients.</li>
      <li>Tick <b>Skip the approval step</b> on the Data tab — your approval is dismissed, because
        that flag is now inside the hash. Re-approve, execute, and step 3 is <i>skipped</i>.</li>
      <li>Switch to <b>Designer</b> (top left) to see where those four steps come from — the
        request type's task flow. A new request is created with the whole process already in it.</li>
    </ol>
    <div class="tipfoot">Everything runs in your browser. The approval rules, the frozen plan and the
      execution gate are the real logic from the specification — Execute is genuinely blocked until
      the rules pass. Sending mail is simulated.</div>
  </div>`;
}

/* ============================ events ============================ */
document.addEventListener('click', e=>{
  if(S.tipOpen && !e.target.closest('.tipwrap')){
    S.tipOpen=false; $('#tip').innerHTML=''; $('#tipbtn').setAttribute('aria-expanded','false');
  }
  const scrim = e.target.closest('[data-scrim]');
  if(scrim && e.target===scrim){ closeModal(); return; }

  const av = e.target.closest('[data-user]');
  if(av){ S.me=av.dataset.user; render(); toast(`Now viewing as ${USERS[S.me].name}`); return; }

  const modeBtn = e.target.closest('[data-mode]');
  if(modeBtn){
    S.mode = modeBtn.dataset.mode;
    S.screen = S.mode==='designer' ? 'definition' : 'inbox';
    render(); return;
  }
  const nav = e.target.closest('[data-nav]');
  if(nav){ S.screen = nav.dataset.nav; render(); return; }

  const openRow = e.target.closest('[data-open]');
  if(openRow){ S.openRequestId=openRow.dataset.open; S.screen='request'; S.requestTab='tasks'; render(); return; }

  const tab = e.target.closest('[data-tab]');
  if(tab){ S.inboxTab=tab.dataset.tab; render(); return; }
  const rtab = e.target.closest('[data-rtab]');
  if(rtab){ S.requestTab=rtab.dataset.rtab; render(); return; }
  const dsec = e.target.closest('[data-def]');
  if(dsec && dsec.dataset.act===undefined && dsec.hasAttribute('data-def') && dsec.tagName==='BUTTON' && !dsec.dataset.act){
    if(dsec.closest('.sidenav')){ S.defSection=dsec.dataset.def; render(); return; }
  }

  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.dataset.act;
  const r = req();

  switch(act){
    case 'toggle-tip': S.tipOpen=!S.tipOpen; S.tipSeen=true; render(); break;
    case 'toggle-gate': S.gateOpen=!S.gateOpen; render(); break;
    case 'back': case 'back-inbox': S.mode='runtime'; S.screen='inbox'; render(); break;
    case 'close': closeModal(); break;
    case 'approve':   approve('APPROVED'); break;
    case 'reject':    approve('REJECTED'); break;
    case 'unapprove': unapprove(); break;

    case 'toggle-cr':{
      const c=r.changeRequests.find(x=>x.id===btn.dataset.id);
      c.resolved=!c.resolved;
      note(r, c.resolved?'resolved a change request':'reopened a change request');
      render(); toast(c.resolved?'Marked resolved':'Reopened'); break;
    }
    case 'post-comment': case 'post-cr':{
      const ta=$('#composer'); const text=(ta?.value||'').trim();
      if(!text){ toast('Write something first'); ta?.focus(); break; }
      if(act==='post-comment'){
        r.comments.push({id:'c'+(++S.seq), user:S.me, text, at:stamp()});
        note(r,'commented');
      }else{
        r.changeRequests.push({id:'cr'+(++S.seq), user:S.me, text, resolved:false, at:stamp()});
        note(r,'requested a change');
      }
      render(); toast(act==='post-cr'?'Change requested':'Comment added'); break;
    }

    case 'add-task':    dlgAddTask(+(btn.dataset.at ?? r.taskItems.length)); break;
    case 'pick-task':   dlgConfigTask(btn.dataset.def, +btn.dataset.at); break;
    case 'do-unblock':{
      const values = {};
      document.querySelectorAll('#modal [data-p]').forEach(el=>{ values[el.dataset.p]=el.value.trim(); });
      resolveBlocker(btn.dataset.id, values); break;
    }
    case 'save-task':{
      const defName=btn.dataset.def;
      const def=TASK_DEFS[defName];
      const cfg = {};
      document.querySelectorAll('#modal [data-p]').forEach(el=>{
        if(el.disabled || el.readOnly) return;
        cfg[el.dataset.p]=el.value.trim();
      });
      let missing=null, unfixable=null;
      def.params.forEach(p=>{
        if(!p.required || cfg[p.name]) return;
        if(p.hidden || p.readonly) unfixable = unfixable || p.label;
        else missing = missing || p.label;
      });
      if(missing){ toast(`${missing} is required`); break; }
      if(unfixable){
        toast(`${unfixable} has no value, and it is not editable here — give it a default on the request type`);
        break;
      }
      {
        /* Ad-hoc tasks are never `required` — only steps that came from the flow are. */
        const at = btn.dataset.at==='' ? r.taskItems.length
                 : Math.max(0, Math.min(r.taskItems.length, +btn.dataset.at));
        r.taskItems.splice(at, 0, {id:'ti'+(++S.seq), def:defName, status:'NOT_RUN',
          attempts:0, config:cfg, required:false, skipWhen:[], requires:[]});
        note(r,`added a ${def.label} task at position ${at+1}`);
        toast('Task added');
      }
      r.version++;
      closeModal(); render(); break;
    }
    case 'del-task':{
      r.taskItems=r.taskItems.filter(t=>t.id!==btn.dataset.id);
      r.logs=r.logs.filter(l=>l.taskId!==btn.dataset.id);
      note(r,'removed a task'); r.version++;
      render(); toast('Task removed'); break;
    }
    case 'show-log': dlgLog(btn.dataset.id); break;
    case 'show-submission': dlgSubmission(btn.dataset.id); break;

    case 'run-all': startRun(); break;
    case 'cancel-run': cancelRun(); break;
    case 'sign':{
      const w = r.workItems.find(x=>x.id===btn.dataset.id);
      if(w && w.kind==='BLOCKER') dlgBlocker(w.id); else dlgSign(btn.dataset.id);
      break;
    }
    case 'do-sign': case 'do-refuse':{
      const w=r.workItems.find(x=>x.id===btn.dataset.id);
      const def=TASK_DEFS[r.taskItems.find(t=>t.id===w.taskItemId).def];
      const result={};
      document.querySelectorAll('#modal [data-p]').forEach(el=>{ result[el.dataset.p]=el.value.trim(); });
      if(act==='do-refuse'){
        /* The reason lives in the last result field, whatever the definition called it. */
        const last = def.resultParams[def.resultParams.length-1];
        const reason = last ? String(result[last.name]||'').trim() : '';
        if(!reason){ toast(`Declining needs a reason — use the ${last?last.label:'last'} field`); break; }
        rejectWorkItem(w.id, reason); break;
      }
      let missing=null;
      def.resultParams.forEach(p=>{ if(p.required && !result[p.name]) missing=missing||p.label; });
      if(missing){ toast(`${missing} is required`); break; }
      completeWorkItem(w.id, result); break;
    }

    case 'new-request': dlgNewRequest(); break;
    case 'create-request':{
      const name=($('#nr-name')?.value||'').trim();
      if(!name){ toast('Give the request a title'); break; }
      const id='TR-'+(2088+S.seq);
      const data={}; S.definition.dataParameters.forEach(p=>data[p.name]=p.defaultValue);
      /* The whole point of a task flow: the plan arrives already built. */
      const items = instantiateFlow(S.definition, S.seq);
      S.seq += items.length;
      S.requests.unshift({
        id, name, requester:S.me, createdAt:stamp(), version:1,
        data, taskItems:items, approvals:[], changeRequests:[], comments:[], logs:[],
        workItems:[], run:null,
        history:[{at:stamp(), who:S.me,
          text:`created this request from ${S.definition.name} — ${items.length} step${items.length===1?'':'s'} instantiated`}],
      });
      S.seq++; S.openRequestId=id; S.screen='request'; S.requestTab='tasks';
      closeModal(); render();
      toast(`Request created with ${items.length} step${items.length===1?'':'s'}`); break;
    }

  }
});

document.addEventListener('change', e=>{
  const el=e.target; const act=el.dataset.act; if(!act) return;
  const r=req();
  if(act==='data-bool'){ r.data[el.dataset.name]=el.checked; r.version++; render(); return; }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.act==='data-text'){ req().data[el.dataset.name]=el.value; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); if(S.tipOpen){ S.tipOpen=false; render(); } }
  const row=e.target.closest?.('[data-open]');
  if(row && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); row.click(); }
});




/* Seeding needs the request-type document, so the first paint waits for the data
   files below. boot() is called once they have all loaded. */
/* index.html needs its sibling files. If one fails to load — a stale cache, a
   rename, a file left behind when the folder was copied — the symptom is
   otherwise a button that silently does nothing. Say which file is missing
   instead. Deliberately self-sufficient: no helper from a sibling is used,
   since the sibling may be exactly what is missing. */
function missingParts(){
  return [
    ['core.js',                  typeof evaluateRule  === 'function'],
    ['inbox-view.js',            typeof viewInbox     === 'function'],
    ['request-view.js',          typeof viewRequest   === 'function'],
    ['dialogs.js',               typeof dlgSign       === 'function'],
    ['run-engine.js',            typeof driveRun      === 'function'],
    ['task-definitions.json.js', typeof window.TASK_DEFINITIONS === 'object'],
    ['request-types.json.js',    typeof window.REQUEST_TYPES   === 'object'],
    ['task-editor.js',           typeof viewTaskDefs  === 'function'],
    ['request-type-editor.js',   typeof viewDefinition === 'function'],
    ['execution-rules-editor.js',typeof defRules      === 'function'],
  ].filter(([,ok])=>!ok).map(([f])=>f);
}

function boot(){
  const missing = missingParts();
  if(missing.length){
    document.querySelector('#screen').innerHTML = `
      <div class="card" style="padding:22px;max-width:620px;margin:40px auto">
        <h1 style="margin:0 0 10px;font-size:19px">The prototype did not load completely</h1>
        <p style="color:var(--ink-2);font-size:13.5px;margin:0 0 12px">
          ${missing.length === 1 ? 'This file' : 'These files'} could not be loaded:</p>
        <div class="te-call mono">${missing.join('<br>')}</div>
        <p style="color:var(--ink-3);font-size:12.5px;margin:12px 0 0">
          They must sit in the same folder as <span class="mono">index.html</span>. If they are
          there, it is almost certainly a cached page — reload with
          <b>Ctrl&nbsp;+&nbsp;Shift&nbsp;+&nbsp;R</b>.</p>
      </div>`;
    return;
  }
  if(!boot._wired){
    $('#themebtn').addEventListener('click',()=>{
      const cur=document.documentElement.getAttribute('data-theme');
      const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark?'light':'dark');
    });
    $('#resetbtn').addEventListener('click',()=>{ boot(); toast('Prototype reset'); });
    boot._wired = true;
  }
  S = seed();
  (function fixSeedHashes(){
    S.requests.forEach(r=>{
      const h=taskConfigHash(r);
      r.approvals.forEach(a=>{ if(a.hash===null) a.hash=h; });
    });
  })();
  render();
}
</script>

<!-- One file per responsibility, all classic scripts sharing one global scope —
     modules and fetch() of siblings are blocked over file://, and this prototype
     must survive being double-clicked. Order only matters for the data files,
     which the editors read at load. -->
<script src="core.js"></script>
<script src="inbox-view.js"></script>
<script src="request-view.js"></script>
<script src="dialogs.js"></script>
<script src="run-engine.js"></script>
<script src="task-definitions.json.js"></script>
<script src="request-types.json.js"></script>
<script src="task-editor.js"></script>
<script src="request-type-editor.js"></script>
<script src="execution-rules-editor.js"></script>
<script>boot();</script>
