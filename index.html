<title>Task Request Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --ground:#F5F7F9; --surface:#FFFFFF; --surface-2:#EEF1F5; --surface-3:#E4E9EF;
  --border:#DCE3EA; --border-strong:#BFC9D4;
  --ink:#131A21; --ink-2:#4A5765; --ink-3:#78858F;
  --accent:#1B5FA8; --accent-ink:#FFFFFF; --accent-soft:#E8F0F8; --accent-line:#A9C6E4;
  --ok:#1B7A4B; --ok-soft:#E3F2EA; --ok-line:#A8D6BE; --on-ok:#FFFFFF;
  --warn:#8A6317; --warn-soft:#F7F0DC; --warn-line:#DCC489;
  --bad:#A83B22; --bad-soft:#F9EAE5; --bad-line:#E3B3A2;
  --shadow-1:0 1px 2px rgba(19,26,33,.06);
  --shadow-2:0 2px 4px rgba(19,26,33,.06),0 8px 24px rgba(19,26,33,.08);
  --shadow-3:0 8px 16px rgba(19,26,33,.10),0 24px 56px rgba(19,26,33,.18);
  --r:6px; --r-lg:10px;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono","Consolas",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1317; --surface:#161D23; --surface-2:#1D262E; --surface-3:#26313A;
    --border:#2A343D; --border-strong:#3D4A56;
    --ink:#E3E9EE; --ink-2:#A5B2BE; --ink-3:#7A8792;
    --accent:#5B9BE8; --accent-ink:#0B1015; --accent-soft:#17242F; --accent-line:#2F4D6B;
    --ok:#4FBE85; --ok-soft:#122319; --ok-line:#255E42; --on-ok:#0B1015;
    --warn:#D8AE5A; --warn-soft:#241E11; --warn-line:#5C4A22;
    --bad:#E47B5C; --bad-soft:#291712; --bad-line:#633324;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
    --shadow-3:0 8px 16px rgba(0,0,0,.5),0 24px 56px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1317; --surface:#161D23; --surface-2:#1D262E; --surface-3:#26313A;
  --border:#2A343D; --border-strong:#3D4A56;
  --ink:#E3E9EE; --ink-2:#A5B2BE; --ink-3:#7A8792;
  --accent:#5B9BE8; --accent-ink:#0B1015; --accent-soft:#17242F; --accent-line:#2F4D6B;
  --ok:#4FBE85; --ok-soft:#122319; --ok-line:#255E42; --on-ok:#0B1015;
  --warn:#D8AE5A; --warn-soft:#241E11; --warn-line:#5C4A22;
  --bad:#E47B5C; --bad-soft:#291712; --bad-line:#633324;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --shadow-3:0 8px 16px rgba(0,0,0,.5),0 24px 56px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;flex:none}
.brand .mark{
  width:24px;height:24px;border-radius:5px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:none;
}
.brand .sub{color:var(--ink-3);font-weight:400;font-size:12px;
  padding-left:10px;margin-left:2px;border-left:1px solid var(--border)}
/* The bar is one non-wrapping row, so the nav must never be the thing that
   shrinks — a clipped nav item reads as a missing feature. */
.topnav{display:flex;gap:2px;margin-left:8px;flex:none}
.topnav button{
  background:none;border:0;padding:7px 11px;border-radius:var(--r);color:var(--ink-2);
  cursor:pointer;font-weight:500;white-space:nowrap;flex:none;
}
.topnav button:hover{background:var(--surface-2);color:var(--ink)}
.topnav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1;min-width:0}
/* In a narrow window (a VS Code preview pane, say) drop the decoration before
   the navigation: the wordmark suffix first, then the "Viewing as" label. */
@media (max-width:900px){
  .topbar{gap:10px;padding:0 10px}
  .brand .sub{display:none}
}
@media (max-width:760px){
  .userswitch>span{display:none}
  .brand{font-size:0}
  .brand .mark{font-size:13px}
}

.userswitch{display:flex;align-items:center;gap:8px}
.userswitch>span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.avatars{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:var(--r)}
.avatar{
  width:28px;height:28px;border-radius:5px;border:0;cursor:pointer;
  background:transparent;color:var(--ink-3);font-size:11px;font-weight:600;
  font-family:var(--mono);
}
.avatar:hover{background:var(--surface-3);color:var(--ink)}
.avatar[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{
  background:none;border:1px solid transparent;border-radius:var(--r);
  width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

.main{flex:1;padding:22px 16px 72px;max-width:1220px;margin:0 auto;width:100%}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
  font-weight:500;cursor:pointer;white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.go:hover:not(:disabled){filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;border:1px solid;
  text-transform:uppercase;white-space:nowrap;
}
.pill.neutral{background:var(--surface-2);border-color:var(--border);color:var(--ink-2)}
.pill.blue{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.pill.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 4px 2px 8px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--ink-2);
}
.chip button{background:none;border:0;cursor:pointer;color:var(--ink-3);
  width:16px;height:16px;border-radius:50%;display:grid;place-items:center;padding:0;line-height:1}
.chip button:hover{background:var(--surface-3);color:var(--ink)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;
  color:var(--ink-2);cursor:pointer;font-weight:500;margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .count{color:var(--ink-3);font-weight:400;font-family:var(--mono);font-size:12px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:11.5px;color:var(--ink-3)}
input[type=text],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);
  padding:7px 9px;width:100%;
}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
.req{color:var(--bad)}

.empty{padding:26px;text-align:center;color:var(--ink-3);border:1px dashed var(--border-strong);
  border-radius:var(--r-lg);font-size:13px}

/* ---------- tips popover ---------- */
.tipwrap{position:relative;display:flex}
.iconbtn.accent{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line);position:relative}
.iconbtn.accent:hover{background:var(--accent-soft);filter:brightness(.97)}
.iconbtn.accent::after{
  content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 2px var(--surface);animation:nudge 2.4s ease-in-out infinite;
}
.iconbtn.accent.seen::after{display:none}
@keyframes nudge{0%,100%{opacity:1}50%{opacity:.3}}
.tip{
  position:absolute;top:40px;right:0;width:330px;z-index:60;padding:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);
}
.tip h3{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.tip ol{margin:0;padding-left:17px;color:var(--ink-2);font-size:13px;display:grid;gap:7px}
.tip ol b{color:var(--ink);font-weight:600}
.tip .tipfoot{margin-top:12px;padding-top:11px;border-top:1px solid var(--border);
  font-size:12px;color:var(--ink-3);line-height:1.55}

/* ---------- inbox ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:21px;letter-spacing:-.02em;text-wrap:balance}
.page-head p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters select{width:auto;padding:5px 8px;font-size:13px}
.rows{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.row{display:flex;gap:14px;padding:13px 15px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .rmain{flex:1;min-width:0}
.row .rtitle{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row .rtitle .id{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.row .rtitle strong{font-weight:600;letter-spacing:-.01em}
.row .rmeta{margin-top:4px;font-size:12.5px;color:var(--ink-3);display:flex;gap:7px;flex-wrap:wrap}
.row .rmeta .dot{color:var(--border-strong)}
.row .rside{text-align:right;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-top:2px}

/* ---------- request editor ---------- */
.rq-head{margin-bottom:16px}
.backlink{background:none;border:0;padding:0;color:var(--ink-3);cursor:pointer;font-size:13px;
  display:inline-flex;align-items:center;gap:5px;margin-bottom:9px}
.backlink:hover{color:var(--accent)}
.rq-title{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.rq-title h1{margin:0;font-size:22px;letter-spacing:-.02em}
.rq-sub{margin-top:5px;color:var(--ink-3);font-size:13px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rq-actions{display:flex;gap:8px;align-items:center;margin-left:auto}

.rq-body{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:20px;align-items:start}
.rq-body.norail{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.rq-body{grid-template-columns:1fr}}

/* task cards */
.tasklist{display:grid;gap:10px}
.task{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--shadow-1);overflow:hidden}
.task.failed{border-color:var(--bad-line)}
.task-top{display:flex;gap:11px;padding:12px 13px;align-items:flex-start}
.task-ico{width:30px;height:30px;border-radius:var(--r);background:var(--surface-2);
  display:grid;place-items:center;color:var(--ink-2);flex:none}
.task.failed .task-ico{background:var(--bad-soft);color:var(--bad)}
.task-main{flex:1;min-width:0}
.task-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task-name strong{font-weight:600}
.task-cfg{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.kv{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);
  padding:1px 6px;border-radius:4px;color:var(--ink-2)}
.kv b{color:var(--ink);font-weight:500}
.task-note{margin-top:7px;font-size:12.5px;color:var(--ink-3)}
.task-err{margin-top:8px;padding:8px 10px;background:var(--bad-soft);border:1px solid var(--bad-line);
  border-radius:var(--r);font-size:12.5px;color:var(--bad);display:flex;gap:7px;align-items:flex-start}
.task-err .mono{font-size:11.5px}
.task.waiting{border-color:var(--warn-line)}
.task.waiting .task-ico{background:var(--warn-soft);color:var(--warn)}
.task-wait{margin-top:8px;padding:9px 10px;background:var(--warn-soft);border:1px solid var(--warn-line);
  border-radius:var(--r);font-size:12.5px;color:var(--warn);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.task-wait .wi{flex:none;display:grid;place-items:center}
.task-wait .mono{font-size:11.5px}
/* what a person entered, once the step is closed */
.task-sub{margin-top:8px;padding:6px 9px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r);font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.task-sub .si{flex:none;display:grid;place-items:center;color:var(--ink-3)}
.task-sub>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.subhead b{color:var(--ink)}
input[readonly],textarea[readonly]{background:var(--surface-2);color:var(--ink-2);cursor:default}
textarea[readonly]{resize:vertical;line-height:1.5}
.task-acts{display:flex;gap:1px;flex:none;margin-left:6px}
.task-acts .ico{
  width:28px;height:28px;padding:0;justify-content:center;border-color:transparent;
  background:transparent;color:var(--ink-3);position:relative;
}
.task-acts .ico:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.task-acts .ico .n{position:absolute;top:2px;right:3px;font-family:var(--mono);font-size:9px;line-height:1;
  color:var(--ink-3)}

.addbar{margin-top:12px}
/* Insert points between steps — quiet until you go near them. */
.insert{height:0;display:flex;justify-content:center;position:relative;z-index:1}
.insert button{
  width:22px;height:22px;margin-top:-11px;border-radius:50%;padding:0;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-3);
  display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s;
}
.tasklist:hover .insert button{opacity:.55}
.insert button:hover,.insert button:focus-visible{opacity:1;border-color:var(--accent);
  background:var(--accent-soft);color:var(--accent)}
.databar{display:flex;gap:9px;align-items:center;padding:9px 13px;font-size:12.5px;
  background:var(--warn-soft);border-bottom:1px solid var(--warn-line);color:var(--warn)}

/* right rail */
.rail{display:grid;gap:12px;position:sticky;top:72px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.panel-head h3{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.panel-body{padding:11px 13px;display:grid;gap:9px}
.approver{display:flex;align-items:center;gap:9px;font-size:13px}
.approver .av{width:24px;height:24px;border-radius:5px;background:var(--surface-2);
  display:grid;place-items:center;font-size:10.5px;font-weight:600;font-family:var(--mono);
  color:var(--ink-2);flex:none;border:1px solid var(--border)}
.approver.did .av{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.approver.stale .av{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.approver .who{flex:1;min-width:0}
.approver .who small{display:block;color:var(--ink-3);font-size:11.5px}

/* gate */
.gate{margin-top:18px;border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden}
.gate.open{border-color:var(--ok-line)}
.gate.parked{border-color:var(--warn-line)}
.gate-bar{display:flex;align-items:center;gap:10px;padding:9px 11px 9px 13px;flex-wrap:wrap}
.gate.open .gate-bar{background:var(--ok-soft)}
.gate.parked .gate-bar{background:var(--warn-soft)}
.gate.parked .gate-toggle .gi{color:var(--warn)}
.gate-toggle{
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;
  background:none;border:0;padding:4px 2px;border-radius:var(--r);cursor:pointer;
  color:var(--ink);font-weight:600;
}
.gate-toggle:hover{color:var(--accent)}
.gate-toggle .gi{flex:none;display:grid;place-items:center;color:var(--warn)}
.gate.open .gate-toggle .gi{color:var(--ok)}
.gate-toggle .gsub{font-weight:400;color:var(--ink-3);font-size:12.5px}
.gate-toggle .chev{flex:none;display:grid;place-items:center;color:var(--ink-3);transition:transform .15s}
.gate-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.gate-detail{border-top:1px solid var(--border);background:var(--surface-2)}
.gate.open .gate-detail{border-color:var(--ok-line)}
.gate-rules{padding:11px 14px;display:grid;gap:8px}
.grule{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.grule .gi{flex:none;margin-top:1px}
.grule.pass .gi{color:var(--ok)}
.grule.fail .gi{color:var(--bad)}
.grule .gt{flex:1}
.grule .gr{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.gate-foot{padding:9px 14px;border-top:1px solid var(--border)}
.gate-foot .hash{font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:help}

/* data tab */
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;
  padding:15px;max-width:720px}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{width:36px;height:20px;border-radius:20px;background:var(--surface-3);
  border:1px solid var(--border-strong);position:relative;transition:background .15s,border-color .15s;flex:none}
.track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow-1);transition:transform .15s}
.switch input:checked+.track{background:var(--ok);border-color:var(--ok)}
.switch input:checked+.track::after{transform:translateX(16px)}

/* conversation */
.thread{display:grid;gap:11px;padding:15px;max-width:760px}
.msg{display:flex;gap:10px}
.msg .av{width:28px;height:28px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;font-size:11px;font-weight:600;font-family:var(--mono);color:var(--ink-2);flex:none}
.msg .bubble{flex:1;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.msg .bhead{padding:6px 11px;background:var(--surface-2);border-bottom:1px solid var(--border);

/* ============================ icons ============================ */
const I = {

  pause:'<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg>',
  pen:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 14.2h12.4"/><path d="M11.1 2.2a1.6 1.6 0 0 1 2.3 2.3l-7 7-3 .7.7-3z"/></svg>',
  doc:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 1.8h6l3.2 3.2v9.2H3.4z"/><path d="M9.2 1.9V5h3.2M5.6 8.4h4.8M5.6 10.9h3.2"/></svg>',
  box:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 4.6 8 1.8l6.2 2.8v6.8L8 14.2l-6.2-2.8z"/><path d="M1.8 4.6 8 7.4l6.2-2.8M8 7.4v6.8"/></svg>',
  mail:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.6" y="3.2" width="12.8" height="9.6" rx="1.4"/><path d="m1.9 4.4 6.1 4.3 6.1-4.3"/></svg>',
  stamp:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.6h10.8"/><rect x="2.6" y="9.6" width="10.8" height="2.6" rx="1"/><path d="M6 9.6V7.4a2 2 0 0 1-.6-1.5V4.2a2 2 0 0 1 2-2h1.2a2 2 0 0 1 2 2v1.7A2 2 0 0 1 10 7.4v2.2"/></svg>',
  eye:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.2 8S3.8 3.6 8 3.6 14.8 8 14.8 8 12.2 12.4 8 12.4 1.2 8 1.2 8Z"/><circle cx="8" cy="8" r="1.9"/></svg>',
};

/* ============================ reference data ============================ */
const USERS = {
  mb:{id:'mb',name:'M. Browett',initials:'MB',roles:['NetOps']},
  as:{id:'as',name:'A. Schmidt',initials:'AS',roles:['Administrator','NetOps']},
  kw:{id:'kw',name:'K. Weber', initials:'KW',roles:['Administrator']},
  jn:{id:'jn',name:'J. Novak',  initials:'JN',roles:['Viewer']},
  /* Not a person and never selectable — the identity a resumed run executes under. */
  system:{id:'system',name:'System',initials:'SYS',roles:[]},
};
const USER_ORDER = ['mb','as','kw','jn'];

/* A request's status is DERIVED from its execution, never set by hand. The
   original design had a second, user-driven state machine next to the run's —
   with APPROVED-the-status competing with the approvals rule for the same word.
   One lifecycle is enough: open until the work is done. */
const STATUS_TONE = {OPEN:'blue', COMPLETED:'ok'};
function requestStatus(r){
  return r.taskItems.length && r.taskItems.every(t=>t.status==='SUCCEEDED'||t.status==='SKIPPED')
    ? 'COMPLETED' : 'OPEN';
}

/* ============================ state ============================ */
let S;

/* One worked example: the notification a network operator has to send customers
   before planned maintenance. Four steps — a person drafts it, the server
   fingerprints the exact wording, an administrator approves that wording, the
   server sends it and records what the mail server answered. */

/* Creating a request instantiates the request type's task flow. The step's rules
   are copied onto the task item, not referenced: a request is bound to the flow
   as it was when it was raised, and editing the template later must not change
   what an in-flight request will do. Same reasoning as definitionVersion. */
function instantiateFlow(definition, seqBase){
  let n = seqBase;
  const copy = x => JSON.parse(JSON.stringify(x));
  return (definition.taskFlow||[]).map(step=>({
    id:'ti'+(++n), def:step.taskDefinition, stepId:step.stepId, required:!!step.required,
    status:'NOT_RUN', attempts:0,
    config:copy(step.defaults||{}),
    /* runtimeConfig is the administrator half: how the engine behaves at this
       step. It sits on the item rather than in its config, so it never appears
       in the task form the requester fills in. */
    onRefusal:(step.runtimeConfig||{}).onRefusal || null,
    assignedRoles:copy((step.runtimeConfig||{}).assignedRoles||[]),
    dueBy:(step.runtimeConfig||{}).dueBy || null,
    skipWhen:copy((step.runtimeConfig||{}).skipWhen||[]),
    requires:copy((step.runtimeConfig||{}).requires||[]),
  }));
}
function seed(){
  /* The request type comes from request-types.json.js — the document the server
     would return from GET /taskrequestdefs. Its taskFlow is the ordered template
     a new request is instantiated from. */
  const definition = currentRequestType();
  const data = {};
  definition.dataParameters.forEach(p=>{ data[p.name] = p.defaultValue; });

  return {
    me:'mb',
    screen:'inbox',
    /* "All open" rather than "Awaiting my approval": the one seeded request belongs
       to the starting user, so an approval-filtered inbox would open empty. */
    inboxTab:'open',
    requestTab:'tasks',
    defSection:'flow',
    flowOpen:null,
    openRequestId:'TR-2087',
    tipOpen:false, tipSeen:false, gateOpen:false,
    seq:6,
    definition,
    requests:[
      {
        id:'TR-2087', name:'Notify customers — R12 uplink switch replacement',
        requester:'mb',
        createdAt:'03.09.2026 09:14', version:3,
        data,
        /* Instantiated from the flow, exactly as a new request would be — so the
           seed cannot drift from the template it claims to come from. */
        taskItems:instantiateFlow(definition, 0),
        approvals:[
          {id:'a1', user:'kw', decision:'APPROVED', at:'03.09.2026 09:41', hash:null},
        ],
        changeRequests:[],
        comments:[
          {id:'c1', user:'mb', text:'Uplink switch in R12 gets replaced in the September window. '
            +'Customers on that switch have to be told a week in advance — this is the notification.',
           at:'03.09.2026 09:14'},
        ],
        history:[
          {at:'03.09.2026 09:14', who:'mb', text:'created this request from Maintenance Notification'},
          {at:'03.09.2026 09:41', who:'kw', text:'approved this request'},
        ],
        logs:[], workItems:[], run:null,
      },
    ],
  };
}

/* ============================ helpers ============================ */
const $  = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const me  = ()=>USERS[S.me];
const req = ()=>S.requests.find(r=>r.id===S.openRequestId);
const hasRole = (u,r)=>USERS[u].roles.includes(r);
const sleep = ms=>new Promise(r=>setTimeout(r,ms));

/* Deterministic stand-in for the SHA-256 taskConfigHash in the spec. */
function fnv(str){
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<str.length;i++){
    h1=(h1^str.charCodeAt(i))>>>0; h1=(h1*0x01000193)>>>0;
    h2=(h2+str.charCodeAt(i)*(i+7))>>>0;
  }
  return (h1.toString(16)+h2.toString(16)).padStart(12,'0').slice(0,12);
}
/* What an approval is bound to.

   Task configs alone are not enough once a step can be skipped by a data flag:
   approve, set skipApproval, execute, and the approval step vanishes without
   anything being invalidated — approve-then-edit-then-execute wearing a hat.
   So the hash covers the plan AND the author-owned data.

   Execution-written fields are excluded, or a run would dismiss its own
   approvals the moment a task stored an output. */
function authorData(r){
  const out = {};
  (S.definition.dataParameters||[])
    .filter(p=>p.owner!=='EXECUTION')
    .forEach(p=>{ out[p.name] = r.data[p.name]; });
  return out;
}
function taskConfigHash(r){
  /* onRefusal is in here even though the requester cannot set it: the task item
     carries it, and what the approver approved includes whether this step may be
     declined at all. */
  const items = (r.taskItems||[]).map(t=>
    ({d:t.def, c:t.config, s:t.skipWhen, q:t.requires, f:t.onRefusal,
      a:t.assignedRoles, u:t.dueBy}));
  return fnv(JSON.stringify({tasks:items, data:authorData(r)}));
}

/* Does this request type require approval at all? If not, there is no approvals
   rail to draw and no "awaiting my approval" inbox to fill — showing either would
   be inventing a step the process does not have. */
function requiresApprovals(){
  return (S.definition.executionRules||[]).some(x=>x.kind==='approvals');
}

/* A run is in flight while it is working or parked on a work item. */
function runInFlight(r){ return !!r.run && (r.run.state==='RUNNING' || r.run.state==='WAITING'); }
function openWorkItems(r){ return (r.workItems||[]).filter(w=>w.state==='OPEN'); }
function myWorkItems(r,user){
  return openWorkItems(r).filter(w=>w.roles.some(ro=>hasRole(user,ro)));
}
function eligibleFor(w){ return USER_ORDER.filter(u=>w.roles.some(ro=>hasRole(u,ro))); }
function stamp(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2100);
}

/* ============================ rule engine ============================ */
/* Mirrors evaluateRule() from the specification, reasons included. */
function evaluateRule(rule,r){
  const hash = taskConfigHash(r);
  switch(rule.kind){
    case 'approvals':{
      const roles = rule.roles||[];
      const valid = r.approvals.filter(a=>
        a.decision==='APPROVED' &&
        a.hash===hash &&
        (!roles.length || roles.some(ro=>hasRole(a.user,ro))) &&
        (!rule.excludeRequester || a.user!==r.requester));
      const dismissed = r.approvals.filter(a=>a.decision==='APPROVED' && a.hash!==hash).length;
      const label = `${rule.min} approval${rule.min===1?'':'s'}`
        + (roles.length?` from ${roles.join(' or ')}`:'')
        + (rule.excludeRequester?' (not the requester)':'');
      let reason = `${valid.length} of ${rule.min} so far`;
      if(dismissed) reason += ` — ${dismissed} dismissed because a task was edited after signing off`;
      return {label, satisfied: valid.length>=rule.min, reason};
    }
    case 'noUnresolvedChangeRequests':{
      const open = r.changeRequests.filter(c=>!c.resolved).length;
      return {label:'No unresolved change requests', satisfied:open===0,
              reason: open?`${open} still open`:'all resolved'};
    }
    case 'allTasksSucceeded':{
      const bad = r.taskItems.filter(t=>t.status!=='SUCCEEDED').length;
      return {label:'Every task has run successfully', satisfied:bad===0,
              reason: bad?`${bad} not yet successful`:'all succeeded'};
    }
    case 'data':{
      const v = r.data[rule.path];
      const param = S.definition.dataParameters.find(p=>p.name===rule.path);
      const ok = rule.op==='truthy' ? !!v : v===rule.value;
      return {label:`${param?param.label:rule.path} must be set`, satisfied:ok,
              reason: ok?'confirmed':'not confirmed yet'};
    }
    default: return {label:rule.kind, satisfied:false, reason:'unknown rule'};
  }
}
/* Why the gate said no, in one sentence. The prototype's stand-in for the
   GateDTO the real server returns inside a RULE_NOT_SATISFIED refusal — the
   server decides, but it also explains, and the client renders what it sent. */
function gateRefusal(r, gate){
  if(gate.noTasks) return 'a request needs at least one task';
  const failing = gate.rules.filter(x=>!x.satisfied);
  if(!failing.length) return 'rules are not satisfied';
  return `${failing[0].label} — ${failing[0].reason}`
       + (failing.length>1?` (and ${failing.length-1} more, see the checklist)`:'');
}

function evaluateGate(r){
  const rules = S.definition.executionRules.map(rule=>evaluateRule(rule,r));
  const noTasks = r.taskItems.length===0;
  return {
    rules,
    hash: taskConfigHash(r),
    noTasks,
    canExecute: !noTasks && rules.every(x=>x.satisfied),
  };
}

/* ============================ render: shell ============================ */
function render(){
  $('#avatars').innerHTML = USER_ORDER.map(id=>{
    const u=USERS[id];

      title="${esc(u.name)} — ${esc(u.roles.join(', '))}">${u.initials}</button>`;

  });
  $('#tip').innerHTML = tipPanel();
  $('#tipbtn').setAttribute('aria-expanded', String(S.tipOpen));
  $('#tipbtn').classList.toggle('seen', S.tipSeen);
  /* A crash while building a screen must be a visible card, not a button that
     silently does nothing. The classic cause here is the Live Preview webview
     serving a cached index.html next to fresh sibling .js files — two versions
     of one program in the same page. */
  try{
    $('#screen').innerHTML =
        S.screen==='inbox'      ? viewInbox()
      : S.screen==='request'    ? viewRequest()
      : S.screen==='definition' ? viewDefinition()

      : '';
  }catch(err){
    console.error(err);
    $('#screen').innerHTML = `
      <div class="card" style="padding:22px;max-width:640px;margin:40px auto">
        <h1 style="margin:0 0 10px;font-size:19px">This screen crashed while rendering</h1>
        <div class="te-call mono">${esc(err && err.message || String(err))}</div>
        <p style="color:var(--ink-2);font-size:13px;margin:12px 0 0">
          If you just edited the prototype's files, the usual cause is the embedded preview serving
          a <b>cached copy of one file next to fresh copies of the others</b> — two versions of the
          same program on one page. Reload with <b>Ctrl&nbsp;+&nbsp;Shift&nbsp;+&nbsp;R</b>, or open
          it in a real browser.</p>
        <p style="color:var(--ink-3);font-size:12px;margin:8px 0 0">
          The full stack trace is in the console (F12).</p>
      </div>`;
  }
}

/* ============================ render: inbox ============================ */
function inboxFilter(){
  const m=S.me;
  /* The human task list. In the real API this is GET /workitems?assignedToMe —
     a query over work items, not over requests. */
  if(S.inboxTab==='action'){
    return S.requests.filter(r=>myWorkItems(r,m).length>0);
  }
  if(S.inboxTab==='awaiting'){
    if(!requiresApprovals()) return [];
    return S.requests.filter(r=>{
      if(r.requester===m) return false;
      if(requestStatus(r)!=='OPEN') return false;
      const hash=taskConfigHash(r);
      return !r.approvals.some(a=>a.user===m && a.hash===hash);
    });
  }
  if(S.inboxTab==='mine')   return S.requests.filter(r=>r.requester===m);
  if(S.inboxTab==='open')   return S.requests.filter(r=>requestStatus(r)==='OPEN');
  return S.requests;
}
function viewInbox(){
  /* If the tab we are on has just been hidden, fall back rather than showing nothing. */
  if(S.inboxTab==='awaiting' && !requiresApprovals()) S.inboxTab='open';
  const counts = {
    awaiting: (()=>{const t=S.inboxTab; S.inboxTab='awaiting'; const n=inboxFilter().length; S.inboxTab=t; return n;})(),
    action:   S.requests.reduce((n,r)=>n+myWorkItems(r,S.me).length,0),
    mine:     S.requests.filter(r=>r.requester===S.me).length,
    open:     S.requests.filter(r=>requestStatus(r)==='OPEN').length,
  };
  const list = inboxFilter();
  return `
  <div class="page-head">
    <div>
      <h1>Task Requests</h1>
      <p>Changes waiting to be reviewed, approved and carried out.</p>
    </div>
    <button class="btn primary" data-act="new-request">${I.plus} New task request</button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${S.inboxTab==='action'}"   data-tab="action">Awaiting my action
      ${counts.action?`<span class="pill warn">${counts.action}</span>`:`<span class="count">0</span>`}</button>
    ${requiresApprovals()?`<button role="tab" aria-selected="${S.inboxTab==='awaiting'}" data-tab="awaiting">Awaiting my approval <span class="count">${counts.awaiting}</span></button>`:''}
    <button role="tab" aria-selected="${S.inboxTab==='mine'}"     data-tab="mine">My requests <span class="count">${counts.mine}</span></button>
    <button role="tab" aria-selected="${S.inboxTab==='open'}"     data-tab="open">All open <span class="count">${counts.open}</span></button>
    <button role="tab" aria-selected="${S.inboxTab==='all'}"      data-tab="all">Everything <span class="count">${S.requests.length}</span></button>
  </div>
  ${list.length ? `<div class="rows">${list.map(inboxRow).join('')}</div>`
    : `<div class="empty">Nothing here for ${esc(me().name)} right now. Try another tab, or switch user.</div>`}`;
}
function inboxRow(r){
  const gate = evaluateGate(r);
  const failed = r.taskItems.filter(t=>t.status==='FAILED').length;
  const appr = S.definition.executionRules.find(x=>x.kind==='approvals');
  const hash = taskConfigHash(r);
  const good = r.approvals.filter(a=>a.decision==='APPROVED'&&a.hash===hash).length;
  const openCr = r.changeRequests.filter(c=>!c.resolved).length;
  const mine = myWorkItems(r,S.me).length;
  const parked = r.run && r.run.state==='WAITING';
  const bits = [`${r.taskItems.length} task${r.taskItems.length===1?'':'s'}`];
  if(appr) bits.push(`${good} of ${appr.min} approvals`);
  if(openCr) bits.push(`${openCr} open change request${openCr===1?'':'s'}`);
  if(failed) bits.push(`${failed} failed execution${failed===1?'':'s'}`);
  else if(parked) bits.push(mine?'waiting for your signature':'waiting for a signature');
  else if(gate.canExecute) bits.push('ready to execute');
  return `<div class="row" data-open="${r.id}" tabindex="0" role="button">
    <div class="rmain">
      <div class="rtitle">
        ${mine?`<span class="pill warn">${I.pause} your turn</span>`:''}
        <span class="pill ${STATUS_TONE[requestStatus(r)]}">${requestStatus(r)}</span>
        <span class="id mono">${r.id}</span>
        <strong>${esc(r.name)}</strong>
        ${failed?`<span class="pill bad">${I.warn} failed</span>`:''}
      </div>
      <div class="rmeta">${bits.map((b,i)=>`${i?'<span class="dot">·</span>':''}<span>${esc(b)}</span>`).join('')}</div>
    </div>
    <div class="rside">${esc(S.definition.name)}<br>${esc(USERS[r.requester].name)}</div>
  </div>`;
}

      <span>${esc(r.createdAt)}</span>
    </div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${S.requestTab==='tasks'}" data-rtab="tasks">Tasks <span class="count">${r.taskItems.length}</span></button>
    <button role="tab" aria-selected="${S.requestTab==='talk'}"  data-rtab="talk">Conversation <span class="count">${r.comments.length+r.changeRequests.length}</span>

    ${requiresApprovals()?`<aside class="rail">${panelApprovals(r,gate)}</aside>`:''}

}

function paneTasks(r,gate){
  /* A run in flight freezes the plan: the hash it is executing must not move
     under it, or half a plan runs under terms nobody approved. */
  const locked = requestStatus(r)==='COMPLETED'||runInFlight(r);
  /* An insert point between every pair of steps, so an extra task can go where it
     belongs in the sequence rather than only at the end. */
  const gap = i => locked ? '' :
    `<div class="insert"><button data-act="add-task" data-at="${i}"
       title="Insert a task here">${I.plus}</button></div>`;
  return `<div class="tasklist">
    ${r.taskItems.length
      ? r.taskItems.map((t,i)=>gap(i)+taskCard(r,t,locked)).join('') + gap(r.taskItems.length)
      : `<div class="empty">No tasks yet. A request needs at least one task before it can be executed.</div>`}
  </div>
  <div class="addbar">
    <button class="btn" data-act="add-task" data-at="${r.taskItems.length}" ${locked?'disabled':''}>${I.plus} Add task at the end</button>
  </div>
  ${gateBox(r,gate)}`;
}
function taskCard(r,t,locked){
  const def = TASK_DEFS[t.def];
  const tone = {NOT_RUN:'neutral',RUNNING:'blue',WAITING:'warn',SUCCEEDED:'ok',FAILED:'bad',
                SKIPPED:'neutral'}[t.status];
  const label= {NOT_RUN:'not run',RUNNING:'running…',WAITING:'waiting for a person',
                SUCCEEDED:'succeeded',FAILED:'failed',SKIPPED:'skipped'}[t.status];
  const taskLogs = r.logs.filter(l=>l.taskId===t.id);
  const last = taskLogs.slice(-1)[0];
  const logCount = taskLogs.length;
  const open = (r.workItems||[]).find(x=>x.taskItemId===t.id && x.state==='OPEN');
  const w = open && open.kind!=='BLOCKER' ? open : null;
  const blocker = open && open.kind==='BLOCKER' ? open : null;
  const canSign = w && w.roles.some(ro=>hasRole(S.me,ro));
  const canClear = blocker && blocker.roles.some(ro=>hasRole(S.me,ro));
  const submitted = lastSubmission(r,t.id);
  return `<article class="task ${t.status==='FAILED'?'failed':''} ${t.status==='WAITING'?'waiting':''}">
    <div class="task-top">
      <div class="task-ico">${def.icon}</div>
      <div class="task-main">
        <div class="task-name">
          <strong>${esc(def.label)}</strong>
          ${t.stepId?'':`<span class="pill warn" title="Added to this request by hand — not part of the standard ${esc(S.definition.name)} flow">added</span>`}
          ${def.manual?`<span class="pill neutral" title="No server executor — a person closes this one">manual</span>`:''}
          <span class="pill ${tone}">${t.status==='RUNNING'?I.spin:''}${label}</span>
          ${t.attempts>1?`<span class="pill neutral">attempt ${t.attempts}</span>`:''}
        </div>
        <div class="task-cfg">
          ${def.params.filter(p=>!p.hidden && t.config[p.name]).map(p=>
            `<span class="kv">${esc(p.label)} <b>${esc(t.config[p.name])}</b></span>`).join('')}
        </div>
        ${last && t.status==='SUCCEEDED' ? `<div class="task-note">ran ${esc(last.at)} by ${esc(USERS[last.by].name)}${
          last.onBehalfOf?` on behalf of ${esc(USERS[last.onBehalfOf].name)}`:''}</div>`:''}
        ${submitted?`<div class="task-sub">
            <span class="si">${I.eye}</span>
            <div style="flex:1">${esc(submittedPreview(def,submitted))}</div>
            <button class="btn sm ghost" data-act="show-submission" data-id="${t.id}">View</button>
          </div>`:''}
        ${w ? `<div class="task-wait">
            <span class="wi">${I.pause}</span>
            <div style="flex:1">
              <div><b>Execution is parked here.</b> Waiting for ${esc(w.roles.join(' or '))} —
                ${eligibleFor(w).map(u=>esc(USERS[u].name)).join(', ')}${w.dueAt?` · due ${esc(w.dueAt)}`:''}</div>
              <div style="margin-top:2px;opacity:.85">Work item <span class="mono">${esc(w.id)}</span> · the run resumes the moment it closes.</div>
            </div>
            ${canSign?`<button class="btn sm go" data-act="sign" data-id="${w.id}">${I.pen} ${esc(def.completeLabel||'Complete')}</button>`
                     :`<span class="pill neutral">not yours to do</span>`}
          </div>`:''}
        ${blocker?`<div class="task-wait">
            <span class="wi">${I.warn}</span>
            <div style="flex:1">
              <div><b>Blocked before this step could start.</b></div>
              ${blocker.unmet.map(u=>`<div style="margin-top:2px">${esc(u.label)} — ${esc(u.reason)}</div>`).join('')}
            </div>
            ${canClear?`<button class="btn sm go" data-act="sign" data-id="${blocker.id}">Supply &amp; continue</button>`
                      :`<span class="pill neutral">not yours to clear</span>`}
          </div>`:''}
        ${t.status==='SKIPPED'?`<div class="task-note">Skipped — ${esc(t.skipReason||'a skip rule matched')}.</div>`:''}
        ${t.status==='FAILED'? `<div class="task-err">${I.warn}<div>
            <div><b>Execution failed.</b> ${esc(t.error||'')}</div>
            ${t.errorSource?`<div class="mono" style="margin-top:3px;opacity:.85">${esc(t.errorSource)}</div>`:''}
          </div></div>`:''}
      </div>
      <div class="task-acts">
        <button class="btn sm ico" data-act="show-log" data-id="${t.id}"
          title="Execution log" aria-label="Execution log">${I.log}${logCount?`<span class="n">${logCount}</span>`:''}</button>
        <button class="btn sm ico" data-act="del-task" data-id="${t.id}"
          ${locked||t.required?'disabled':''}
          title="${t.required?'Part of the '+esc(S.definition.name)+' process — cannot be removed'
                             :'Remove this task'}"
          aria-label="Remove this task">${I.trash}</button>
      </div>
    </div>
  </article>`;
}

function paneData(r){
  const frozen = runInFlight(r);
  return `<div class="card">
    ${frozen?`<div class="databar">${I.pause} A run is in progress, so the fields it was approved
      against are frozen. Values a blocked step needs are supplied through the work item.</div>`:''}
    <div class="formgrid">
    ${S.definition.dataParameters.map(p=>{
      const v = r.data[p.name];
      /* EXECUTION fields are written by a task's output mapping and sit outside the
         hash. AUTHOR fields are inside it, so they freeze while a run holds it. */
      const written = p.owner==='EXECUTION';
      const disabled = written || frozen;
      const note = written ? `Written by a task — not editable here.`
                 : frozen  ? `Frozen: the approvals for this run cover this value.` : '';
      if(p.type==='boolean'){
        return `<div class="field">
          <label>${esc(p.label)}${written?' <span class="pill neutral">written by a task</span>':''}</label>
          <label class="switch">

            <span>${v?'Yes':'No'}</span>
          </label>
          ${note?`<span class="hint">${esc(note)}</span>`

      }
      return `<div class="field">
        <label>${esc(p.label)}${written?' <span class="pill neutral">written by a task</span>':''}</label>
        <input type="text" value="${esc(v??'')}" data-act="data-text" data-name="${p.name}"

    }).join('')}

}

function panelApprovals(r,gate){
  const hash = gate.hash;
  const rule = S.definition.executionRules.find(x=>x.kind==='approvals');
  const good = r.approvals.filter(a=>a.decision==='APPROVED'&&a.hash===hash&&
    (!rule||!rule.roles.length||rule.roles.some(ro=>hasRole(a.user,ro)))&&
    (!rule||!rule.excludeRequester||a.user!==r.requester));
  const mine = r.approvals.find(a=>a.user===S.me);
  const isRequester = r.requester===S.me;
  const canApprove = !isRequester && (!rule||!rule.roles.length||rule.roles.some(ro=>hasRole(S.me,ro)))
                     && requestStatus(r)==='OPEN';

  const rows = USER_ORDER.filter(u=>u!==r.requester).map(u=>{
    const a = r.approvals.find(x=>x.user===u);
    const stale = a && a.hash!==hash;
    const eligible = !rule||!rule.roles.length||rule.roles.some(ro=>hasRole(u,ro));
    let note = eligible ? USERS[u].roles.join(', ') : `${USERS[u].roles.join(', ')} — cannot approve this type`;
    if(a) note = stale ? 'dismissed — a task was edited' : (a.decision==='APPROVED'?`approved ${a.at}`:`rejected ${a.at}`);
    return `<div class="approver ${a&&!stale&&a.decision==='APPROVED'?'did':''} ${stale?'stale':''}">
      <span class="av">${a&&!stale?(a.decision==='APPROVED'?I.check:I.cross):USERS[u].initials}</span>
      <span class="who">${esc(USERS[u].name)}<small>${esc(note)}</small></span>
    </div>`;
  }).join('');

  return `<section class="panel">
    <div class="panel-head">
      <h3>Approvals</h3>
      <span class="pill ${rule&&good.length>=rule.min?'ok':'neutral'}">${good.length} of ${rule?rule.min:0}</span>
    </div>
    <div class="panel-body">
      ${rows}
      <div class="approver" style="opacity:.65">
        <span class="av">${USERS[r.requester].initials}</span>
        <span class="who">${esc(USERS[r.requester].name)}<small>requester — cannot approve their own</small></span>
      </div>
      ${canApprove
        ? (mine && mine.hash===hash
            ? `<button class="btn sm" data-act="unapprove" style="width:100%;justify-content:center">Withdraw my ${mine.decision==='APPROVED'?'approval':'rejection'}</button>`
            : `<div style="display:flex;gap:6px">
                 <button class="btn sm go" data-act="approve" style="flex:1;justify-content:center">${I.check} Approve</button>
                 <button class="btn sm" data-act="reject" style="justify-content:center">Reject</button>
               </div>`)
        : `<div class="hint" style="font-size:11.5px;color:var(--ink-3)">
             ${isRequester?'You opened this request, so you cannot approve it.'
               : requestStatus(r)!=='OPEN' ? 'Approvals are closed — the work is done.'
               : `${esc(me().name)} does not hold a role that may approve this request type.`}
           </div>`}
    </div>
  </section>`;
}


function gateBox(r,gate){
  const running = r.taskItems.some(t=>t.status==='RUNNING');
  const checks = [
    ...(gate.noTasks?[{label:'At least one task', satisfied:false, reason:'this request has none yet'}]:[]),
    ...gate.rules,
  ];
  const todo = checks.filter(x=>!x.satisfied).length;
  const waiting = r.run && r.run.state==='WAITING' ? openWorkItems(r)[0] : null;
  const allDone = r.taskItems.length>0 && r.taskItems.every(t=>t.status==='SUCCEEDED');

  /* Three states share this bar: a run parked on a person, a run working,
     and no run at all — where the gate decides whether one may start. */
  const head = waiting
    ? `<span class="gi pausing">${I.pause}</span>
       <span>Waiting for a signature <span class="gsub">— ${esc(eligibleFor(waiting).map(u=>USERS[u].name).join(' or '))}${
         waiting.dueAt?`, due ${esc(waiting.dueAt)}`:''}</span></span>`
    : allDone
    ? `<span class="gi">${I.check}</span><span>All tasks completed <span class="gsub">— nothing left to run</span></span>`
    : gate.canExecute
    ? `<span class="gi">${I.check}</span><span>Ready to execute <span class="gsub">— all ${checks.length} checks passed</span></span>`
    : `<span class="gi">${I.warn}</span><span>${todo} thing${todo===1?'':'s'} still ${todo===1?'needs':'need'} doing <span class="gsub">— before this request may run</span></span>`;

  const action = waiting
    ? `<button class="btn ghost" data-act="cancel-run" ${mayCancel(r)?'':'disabled'}
         title="${mayCancel(r)?'Abandon the run and unlock the request for editing'
                             :'Only the requester or an administrator may cancel a run'}">Cancel run</button>`
    : `<button class="btn ${gate.canExecute&&!allDone?'go':''}" data-act="run-all"
         ${gate.canExecute&&!running&&!allDone&&!runInFlight(r)?'':'disabled'}
         title="${gate.canExecute?'Run every task that has not succeeded yet':'Blocked until every check passes'}">
         ${running?I.spin+' Running…':I.play+' Execute all tasks'}
       </button>`;

  return `<section class="gate ${waiting?'parked':gate.canExecute?'open':''}">
    <div class="gate-bar">
      <button class="gate-toggle" data-act="toggle-gate" aria-expanded="${S.gateOpen}" aria-controls="gate-detail">
        ${head}
        <span class="chev">${I.chevD}</span>
      </button>
      ${action}
    </div>
    ${S.gateOpen?`<div class="gate-detail" id="gate-detail">
      <div class="gate-rules">
        ${checks.map(x=>`<div class="grule ${x.satisfied?'pass':'fail'}">
          <span class="gi">${x.satisfied?I.check:I.cross}</span>
          <span class="gt">${esc(x.label)}<div class="gr">${esc(x.reason)}</div></span>
        </div>`).join('')}
      </div>
      <div class="gate-foot">
        <span class="hash" title="A fingerprint of every task and its settings. Edit a task and it changes — which is what dismisses approvals given for the old one.">fingerprint ${gate.hash}</span>
        ${r.run?`<span class="hash" style="margin-left:12px"
          title="A run is bound to the fingerprint it started on, and freezes the plan until it ends.">run ${esc(r.run.id)} · ${esc(r.run.state.toLowerCase())} · step ${Math.min(r.run.cursor+1,r.taskItems.length)} of ${r.taskItems.length} · started by ${esc(USERS[r.run.startedBy].name)}</span>`:''}
      </div>
    </div>`:''}
  </section>`;
}

function lastSubmission(r,taskItemId){
  const closed = (r.workItems||[]).filter(w=>w.taskItemId===taskItemId && w.state!=='OPEN');
  return closed.length ? closed[closed.length-1] : null;

/* ============================ mutations ============================ */
function note(r,text,who){ r.history.push({at:stamp(),who:who||S.me,text}); }

function approve(decision){
  const r=req(); const hash=taskConfigHash(r);
  r.approvals = r.approvals.filter(a=>a.user!==S.me);
  r.approvals.push({id:'a'+(++S.seq), user:S.me, decision, at:stamp(), hash});
  note(r, decision==='APPROVED'?'approved this request':'rejected this request');
  r.version++;
  render(); toast(decision==='APPROVED'?'Approved':'Rejected');
}
function unapprove(){
  const r=req();
  r.approvals = r.approvals.filter(a=>a.user!==S.me);
  note(r,'withdrew their review'); r.version++;
  render(); toast('Withdrawn');
}
/* ---------------------------------------------------------------
   Execution runs.

   A run walks the task list with a cursor. An automatic task is
   dispatched to its executor; a manual task creates a work item and
   the run parks itself until a human closes it. Completing the work
   item resumes the same run — there is no "continue" button, because
   in every engine that does this well the completion *is* the resume.
   --------------------------------------------------------------- */

/* One task item, dispatched.

   Nothing here knows what the task *is* — it resolves the definition's input
   bindings, calls the named server action, and stores whatever the action
   returned according to the output mappings. All four helpers live in
   task-editor.js, which owns the definition model. Returns true on success. */
async function runOneTask(r,t,actor){
  const d = TASK_DEFS[t.def];
  t.status='RUNNING'; render();
  await sleep(520);
  t.attempts++;

  const inputs = resolveInputs(d,t,r);
  const call   = renderResolvedCall(d,t,r);

  if(actionFails(d,inputs)){
    const f = failureFor(d,inputs);
    t.status='FAILED'; t.error=f.message; t.errorSource=f.source;
    r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), outcome:'FAILED', ms:1380, ...actor,
      detail:`${call}\nBusinessLogicError: ${f.message}\n${f.trace}`});
    note(r,`ran ${d.label} — failed`, actor.by);
    render();
    return false;
  }

  const produced = runServerAction(d, inputs, r);
  const stored   = applyOutputs(d, produced, r);
  t.status='SUCCEEDED'; t.error=null;
  t.outputs = Object.keys(produced).length ? produced : null;
  r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), outcome:'SUCCEEDED', ms:410, ...actor,
    detail:`${call}\n${d.label} completed — ${taskSummary(d,t.config)}`
         + (t.outputs?`\nreturned:\n`+Object.entries(t.outputs).map(([k,v])=>`  ${k}: ${v}`).join('\n'):'')
         + (Object.keys(stored).length?`\nstored on the request:\n`
             +Object.entries(stored).map(([k,v])=>`  request.${k} = ${v}`).join('\n'):'')});
  note(r,`ran ${d.label} — succeeded`, actor.by);
  render();
  return true;
}

/* Everything a preceding task handed forward — the payload a signer is shown. */
function priorOutputs(r,upTo){
  return r.taskItems.slice(0,upTo)
    .filter(t=>t.outputs)
    .map(t=>({label:TASK_DEFS[t.def].label, outputs:t.outputs}));
}

function startRun(){
  const r=req();
  const gate=evaluateGate(r);
  /* The server re-evaluates the gate; the button state is only a hint. */
  if(!gate.canExecute){
    S.gateOpen=true; render();
    toast(`The server refused: ${gateRefusal(r,gate)}`); return;
  }
  if(runInFlight(r)){ toast('A run is already in progress'); return; }
  r.run = {id:'run'+(++S.seq), state:'RUNNING', cursor:0, hash:gate.hash,
           startedBy:S.me, startedAt:stamp(), waitingOn:null, resumed:false, triggeredBy:null};
  note(r,'started an execution run');
  driveRun(r);
}

async function driveRun(r){
  const run=r.run; if(!run) return;
  run.state='RUNNING'; render();
  while(run.cursor < r.taskItems.length){
    const t = r.taskItems[run.cursor];
    if(t.status==='SUCCEEDED'||t.status==='SKIPPED'){ run.cursor++; continue; }
    const d = TASK_DEFS[t.def];

    /* Skip: decided once, when the cursor arrives. The run carries straight on —
       nothing waits, and the step is recorded as skipped rather than done. */
    const skip = (t.skipWhen||[]).filter(rule=>evaluateRule(rule,r).satisfied);
    if(skip.length){
      t.status='SKIPPED'; t.skipReason = skip.map(x=>evaluateRule(x,r).label).join('; ');
      r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), outcome:'SKIPPED', ms:0,
        by: run.resumed?'system':run.startedBy,
        detail:`Skipped — ${t.skipReason}.`});
      note(r,`skipped ${d.label}`, run.resumed?'system':S.me);
      run.cursor++; render(); continue;
    }

    /* Precondition: unlike a gate rule, this cannot be checked before the run
       starts, because the value it needs may be produced by an earlier step.
       Two sources feed it: the step's declared `requires` rules, and — with no
       configuration at all — any REQUIRED input of the action that resolves to
       nothing. The action's own contract says what it cannot run without. */
    const unmetRules = (t.requires||[]).map(rule=>evaluateRule(rule,r)).filter(x=>!x.satisfied);
    const missing = d.manual ? [] : missingInputs(d,t,r);
    if(unmetRules.length || missing.length){
      const unmet = [
        ...unmetRules.map(x=>({label:x.label, reason:x.reason})),
        ...missing.map(m=>({label:`Required input "${m.target}" has no value`,
                            reason:describeSource(m.source)})),
      ];
      const needs = [...new Set([
        ...(t.requires||[]).filter(rule=>!evaluateRule(rule,r).satisfied).map(rule=>rule.path),
        ...missing.filter(m=>m.source&&m.source.kind==='REQUEST_DATA').map(m=>m.source.path),
      ])];
      const w = {id:'wi'+(++S.seq), runId:run.id, taskItemId:t.id, kind:'BLOCKER',
        title:`${d.label} cannot start`, roles:['Administrator','NetOps'],
        dueAt:null, state:'OPEN', createdAt:stamp(),
        unmet, needs,
        context:priorOutputs(r,run.cursor), result:null};
      r.workItems.push(w);
      t.status='WAITING';
      run.state='WAITING'; run.waitingOn=w.id;
      note(r,`execution blocked before ${d.label} — ${unmet.map(x=>x.label).join('; ')}`,
        run.resumed?'system':S.me);
      render();
      toast(`Blocked — ${unmet[0].label}`);
      return;
    }

    if(d.manual){
      /* Who may act comes from the step's runtimeConfig, declared by the
         administrator — not from a config field the requester could edit. An
         empty list falls back to Administrator, so no step can park where
         nobody may ever close it. */
      const who = (t.assignedRoles&&t.assignedRoles.length) ? t.assignedRoles : ['Administrator'];
      const w = {id:'wi'+(++S.seq), runId:run.id, taskItemId:t.id, kind:'TASK',
        title:d.label, roles:who,
        dueAt:t.dueBy||null, state:'OPEN', createdAt:stamp(),
        context:priorOutputs(r,run.cursor), result:null};
      r.workItems.push(w);
      t.status='WAITING';
      run.state='WAITING'; run.waitingOn=w.id;
      note(r,`execution paused — waiting for a ${d.label.toLowerCase()}`, run.resumed?'system':S.me);
      render();
      toast(`Paused — ${d.label} is waiting for ${who.join(' or ')}`);
      return;
    }

    /* After a resume nobody is holding the request open, so the run continues
       under the system identity, on behalf of the requester. */
    const actor = run.resumed
      ? {by:'system', onBehalfOf:r.requester, triggeredBy:run.triggeredBy}
      : {by:run.startedBy};
    const ok = await runOneTask(r,t,actor);
    if(!ok && S.definition.onError==='STOP'){
      run.state='FAILED'; run.finishedAt=stamp();
      render(); toast('Run stopped after a failure — remaining tasks left untouched');
      return;
    }
    run.cursor++;
  }
  run.state = r.taskItems.every(t=>t.status==='SUCCEEDED'||t.status==='SKIPPED')
    ? 'COMPLETED' : 'FAILED';
  run.finishedAt=stamp();
  render();
  toast(run.state==='COMPLETED'?'All tasks completed':'Run finished with failures');
}

/* Resolving a blocker: the missing values are supplied through the work item, not
   by editing the Data tab. They are execution-written, so they sit outside the
   hash and the approvals given for this run survive — and the audit trail records
   who supplied them. If nothing satisfies the rule, the run stays parked. */
async function resolveBlocker(id, values){
  const r=req();
  const w=r.workItems.find(x=>x.id===id); if(!w||w.state!=='OPEN') return;
  const t=r.taskItems.find(x=>x.id===w.taskItemId);
  Object.entries(values).forEach(([k,v])=>{ if(v!=='') r.data[k]=v; });
  const tdef = TASK_DEFS[t.def];
  const still = [
    ...(t.requires||[]).map(rule=>evaluateRule(rule,r)).filter(x=>!x.satisfied),
    ...(tdef.manual?[]:missingInputs(tdef,t,r).map(m=>
        ({label:`required input "${m.target}" still has no value`}))),
  ];
  if(still.length){
    render(); toast(`Still blocked — ${still[0].label}`); return;
  }
  w.state='COMPLETED'; w.result=values; w.completedBy=S.me; w.completedAt=stamp();
  t.status='NOT_RUN';
  r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), by:S.me, outcome:'SUCCEEDED', ms:0,
    detail:`Blocker cleared by ${USERS[S.me].name}.\n`
         + Object.entries(values).filter(([,v])=>v).map(([k,v])=>`  request.${k} = ${v}`).join('\n')});
  note(r,`cleared the block on ${TASK_DEFS[t.def].label}`);
  r.run.waitingOn=null; r.run.resumed=true; r.run.triggeredBy=S.me;
  closeModal(); render(); toast('Unblocked — execution continues');
  await driveRun(r);
}

async function completeWorkItem(id,result){
  const r=req();
  const w=r.workItems.find(x=>x.id===id); if(!w||w.state!=='OPEN') return;
  if(w.kind==='BLOCKER') return resolveBlocker(id,result);
  const t=r.taskItems.find(x=>x.id===w.taskItemId);
  const d=TASK_DEFS[t.def];
  w.state='COMPLETED'; w.result=result; w.completedBy=S.me; w.completedAt=stamp();
  t.status='SUCCEEDED'; t.error=null; t.attempts++; t.outputs=result;
  /* A person's answers are stored on the request the same way an action's return
     values are — that is how a drafted message reaches the task that sends it. */
  const stored = applyOutputs(d, result, r);
  r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), by:S.me, outcome:'SUCCEEDED', ms:0,
    detail:`${d.label} completed by ${USERS[S.me].name}.\n`
         + Object.entries(result).filter(([,v])=>v).map(([k,v])=>`  ${k}: ${v}`).join('\n')
         + (Object.keys(stored).length?`\nstored on the request:\n`
             +Object.entries(stored).map(([k,v])=>`  request.${k} = ${v}`).join('\n'):'')});
  note(r,`completed "${w.title}" — execution continues`);
  r.run.cursor++; r.run.waitingOn=null;
  r.run.resumed=true; r.run.triggeredBy=S.me;
  closeModal(); render(); toast('Done — execution continues');
  await driveRun(r);
}

/* What a refusal means is configured per task, because it differs per step.
   Refusing is a decision, not a breakage — so the default routes the request
   back to whoever can act on it rather than marking anything failed. */
/* Set by the administrator on the flow step; the task type supplies a fallback
   for steps that say nothing. The requester never sees it and cannot change it. */
function refusalMode(t){
  const def = TASK_DEFS[t.def] || {};
  return t.onRefusal || def.onRefusalDefault || 'Send back';
}

function rejectWorkItem(id,reason){
  const r=req();
  const w=r.workItems.find(x=>x.id===id); if(!w||w.state!=='OPEN') return;
  const t=r.taskItems.find(x=>x.id===w.taskItemId);
  const d=TASK_DEFS[t.def];
  const mode=refusalMode(t);
  if(mode==='Not allowed'){ toast('This signature cannot be refused — cancel the run instead'); return; }

  /* The refusal itself is recorded the same way whatever the mode. */
  w.state='REJECTED'; w.rejectionReason=reason; w.completedBy=S.me; w.completedAt=stamp();
  r.run.waitingOn=null;

  if(mode==='Fail the task'){
    t.status='FAILED'; t.error=`Signature refused: ${reason}`; t.attempts++;
    r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), by:S.me, outcome:'FAILED', ms:0,
      detail:`${d.label} refused by ${USERS[S.me].name}.\n  reason: ${reason}`});
    note(r,`declined "${w.title}" — the task failed`);
    if(S.definition.onError==='STOP'){
      r.run.state='FAILED'; r.run.finishedAt=stamp();
      closeModal(); render(); toast('Signature refused — the run stopped here');
    }else{
      r.run.cursor++; r.run.resumed=true; r.run.triggeredBy=S.me;
      closeModal(); render(); driveRun(r);
    }
    return;
  }

  /* Send back: nothing failed. The task never ran, the run ends, and the refusal
     becomes an open change request — which the existing rule turns into a red gate. */
  t.status='NOT_RUN';
  r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), by:S.me, outcome:'SENT_BACK', ms:0,
    detail:`${d.label} declined by ${USERS[S.me].name}; sent back to the requester.\n  reason: ${reason}`});
  r.changeRequests.push({id:'cr'+(++S.seq), user:S.me, resolved:false, at:stamp(),
    text:`Declined "${w.title}": ${reason}`});
  r.run.state='SENT_BACK'; r.run.finishedAt=stamp();
  note(r,`declined "${w.title}" and sent the request back`);
  closeModal(); render();
  toast('Sent back to the requester — nothing was marked failed');
}

/* There is deliberately NO way to run one task by hand. Execution happens only
   through a run, which walks the flow in order, honours skip rules and
   preconditions, and validates each action's required inputs before dispatch.
   Retrying a failed step is Execute all again: a new run skips what already
   succeeded and picks up where it failed. */

/* Ending a parked run is the requester's or an administrator's call, never the
   signer's — otherwise "sign or nothing" is defeated by cancelling instead. */
function mayCancel(r){ return r.requester===S.me || hasRole(S.me,'Administrator'); }

function cancelRun(){
  const r=req(); if(!runInFlight(r)) return;
  if(!mayCancel(r)){ toast('Only the requester or an administrator may cancel a run'); return; }
  openWorkItems(r).forEach(w=>{ w.state='CANCELLED'; });
  r.taskItems.filter(t=>t.status==='WAITING').forEach(t=>{ t.status='NOT_RUN'; });
  r.run.state='CANCELLED'; r.run.finishedAt=stamp();
  note(r,'cancelled the execution run');
  render(); toast('Run cancelled — the request is editable again');
}

/* ============================ events ============================ */
document.addEventListener('click', e=>{
  if(S.tipOpen && !e.target.closest('.tipwrap')){
    S.tipOpen=false; $('#tip').innerHTML=''; $('#tipbtn').setAttribute('aria-expanded','false');
  }
  const scrim = e.target.closest('[data-scrim]');
  if(scrim && e.target===scrim){ closeModal(); return; }

  const av = e.target.closest('[data-user]');
  if(av){ S.me=av.dataset.user; render(); toast(`Now viewing as ${USERS[S.me].name}`); return; }

  const nav = e.target.closest('[data-nav]');
  if(nav){ S.screen = nav.dataset.nav; render(); return; }

  const openRow = e.target.closest('[data-open]');
  if(openRow){ S.openRequestId=openRow.dataset.open; S.screen='request'; S.requestTab='tasks'; render(); return; }

  const tab = e.target.closest('[data-tab]');
  if(tab){ S.inboxTab=tab.dataset.tab; render(); return; }
  const rtab = e.target.closest('[data-rtab]');
  if(rtab){ S.requestTab=rtab.dataset.rtab; render(); return; }
  const dsec = e.target.closest('[data-def]');
  if(dsec && dsec.dataset.act===undefined && dsec.hasAttribute('data-def') && dsec.tagName==='BUTTON' && !dsec.dataset.act){
    if(dsec.closest('.sidenav')){ S.defSection=dsec.dataset.def; render(); return; }
  }

  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.dataset.act;
  const r = req();

  switch(act){
    case 'toggle-tip': S.tipOpen=!S.tipOpen; S.tipSeen=true; render(); break;
    case 'toggle-gate': S.gateOpen=!S.gateOpen; render(); break;
    case 'back': case 'back-inbox': S.screen='inbox'; render(); break;
    case 'close': closeModal(); break;
    case 'approve':   approve('APPROVED'); break;
    case 'reject':    approve('REJECTED'); break;
    case 'unapprove': unapprove(); break;

    case 'toggle-cr':{
      const c=r.changeRequests.find(x=>x.id===btn.dataset.id);
      c.resolved=!c.resolved;
      note(r, c.resolved?'resolved a change request':'reopened a change request');
      render(); toast(c.resolved?'Marked resolved':'Reopened'); break;
    }
    case 'post-comment': case 'post-cr':{
      const ta=$('#composer'); const text=(ta?.value||'').trim();
      if(!text){ toast('Write something first'); ta?.focus(); break; }
      if(act==='post-comment'){
        r.comments.push({id:'c'+(++S.seq), user:S.me, text, at:stamp()});
        note(r,'commented');
      }else{
        r.changeRequests.push({id:'cr'+(++S.seq), user:S.me, text, resolved:false, at:stamp()});
        note(r,'requested a change');
      }
      render(); toast(act==='post-cr'?'Change requested':'Comment added'); break;
    }

    case 'add-task':    dlgAddTask(+(btn.dataset.at ?? r.taskItems.length)); break;
    case 'pick-task':   dlgConfigTask(btn.dataset.def, +btn.dataset.at); break;
    case 'do-unblock':{
      const values = {};
      document.querySelectorAll('#modal [data-p]').forEach(el=>{ values[el.dataset.p]=el.value.trim(); });
      resolveBlocker(btn.dataset.id, values); break;
    }
    case 'save-task':{
      const defName=btn.dataset.def;
      const def=TASK_DEFS[defName];
      const cfg = {};
      document.querySelectorAll('#modal [data-p]').forEach(el=>{
        if(el.disabled || el.readOnly) return;
        cfg[el.dataset.p]=el.value.trim();
      });
      let missing=null, unfixable=null;
      def.params.forEach(p=>{
        if(!p.required || cfg[p.name]) return;
        if(p.hidden || p.readonly) unfixable = unfixable || p.label;
        else missing = missing || p.label;
      });
      if(missing){ toast(`${missing} is required`); break; }
      if(unfixable){
        toast(`${unfixable} has no value, and it is not editable here — give it a default on the request type`);
        break;
      }
      {
        /* Ad-hoc tasks are never `required` — only steps that came from the flow are. */
        const at = btn.dataset.at==='' ? r.taskItems.length
                 : Math.max(0, Math.min(r.taskItems.length, +btn.dataset.at));
        r.taskItems.splice(at, 0, {id:'ti'+(++S.seq), def:defName, status:'NOT_RUN',
          attempts:0, config:cfg, required:false, skipWhen:[], requires:[]});
        note(r,`added a ${def.label} task at position ${at+1}`);
        toast('Task added');
      }
      r.version++;
      closeModal(); render(); break;
    }
    case 'del-task':{
      r.taskItems=r.taskItems.filter(t=>t.id!==btn.dataset.id);
      r.logs=r.logs.filter(l=>l.taskId!==btn.dataset.id);
      note(r,'removed a task'); r.version++;
      render(); toast('Task removed'); break;
    }
    case 'show-log': dlgLog(btn.dataset.id); break;
    case 'show-submission': dlgSubmission(btn.dataset.id); break;

    case 'run-all': startRun(); break;
    case 'cancel-run': cancelRun(); break;
    case 'sign':{
      const w = r.workItems.find(x=>x.id===btn.dataset.id);
      if(w && w.kind==='BLOCKER') dlgBlocker(w.id); else dlgSign(btn.dataset.id);
      break;
    }
    case 'do-sign': case 'do-refuse':{
      const w=r.workItems.find(x=>x.id===btn.dataset.id);
      const def=TASK_DEFS[r.taskItems.find(t=>t.id===w.taskItemId).def];
      const result={};
      document.querySelectorAll('#modal [data-p]').forEach(el=>{ result[el.dataset.p]=el.value.trim(); });
      if(act==='do-refuse'){
        /* The reason lives in the last result field, whatever the definition called it. */
        const last = def.resultParams[def.resultParams.length-1];
        const reason = last ? String(result[last.name]||'').trim() : '';
        if(!reason){ toast(`Declining needs a reason — use the ${last?last.label:'last'} field`); break; }
        rejectWorkItem(w.id, reason); break;
      }
      let missing=null;
      def.resultParams.forEach(p=>{ if(p.required && !result[p.name]) missing=missing||p.label; });
      if(missing){ toast(`${missing} is required`); break; }
      completeWorkItem(w.id, result); break;
    }

    case 'new-request': dlgNewRequest(); break;
    case 'create-request':{
      const name=($('#nr-name')?.value||'').trim();
      if(!name){ toast('Give the request a title'); break; }
      const id='TR-'+(2088+S.seq);
      const data={}; S.definition.dataParameters.forEach(p=>data[p.name]=p.defaultValue);
      /* The whole point of a task flow: the plan arrives already built. */
      const items = instantiateFlow(S.definition, S.seq);
      S.seq += items.length;
      S.requests.unshift({
        id, name, requester:S.me, createdAt:stamp(), version:1,
        data, taskItems:items, approvals:[], changeRequests:[], comments:[], logs:[],
        workItems:[], run:null,
        history:[{at:stamp(), who:S.me,
          text:`created this request from ${S.definition.name} — ${items.length} step${items.length===1?'':'s'} instantiated`}],
      });
      S.seq++; S.openRequestId=id; S.screen='request'; S.requestTab='tasks';
      closeModal(); render();
      toast(`Request created with ${items.length} step${items.length===1?'':'s'}`); break;
    }

  }
});

document.addEventListener('change', e=>{
  const el=e.target; const act=el.dataset.act; if(!act) return;
  const r=req();
  if(act==='data-bool'){ r.data[el.dataset.name]=el.checked; r.version++; render(); return; }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.act==='data-text'){ req().data[el.dataset.name]=el.value; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); if(S.tipOpen){ S.tipOpen=false; render(); } }
  const row=e.target.closest?.('[data-open]');
  if(row && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); row.click(); }
});

$('#themebtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
});
$('#resetbtn').addEventListener('click',()=>{ boot(); toast('Prototype reset'); });


/* Seeding needs the request-type document, so the first paint waits for the data
   files below. boot() is called once they have all loaded. */
/* index.html needs five sibling files. If one of them fails to load — a stale
   cache, a rename, a file left behind when the folder was copied — the symptom
   is otherwise a button that silently does nothing, which is a miserable thing
   to debug. Say which file is missing instead. */
function missingParts(){
  return [
    ['task-definitions.json.js', typeof window.TASK_DEFINITIONS === 'object'],
    ['request-types.json.js',    typeof window.REQUEST_TYPES   === 'object'],
    ['task-editor.js',           typeof viewTaskDefs  === 'function'],
    ['request-type-editor.js',   typeof viewDefinition === 'function'],
    ['execution-rules-editor.js',typeof defRules      === 'function'],
  ].filter(([,ok])=>!ok).map(([f])=>f);
}

function boot(){
  const missing = missingParts();
  if(missing.length){
    $('#screen').innerHTML = `
      <div class="card" style="padding:22px;max-width:620px;margin:40px auto">
        <h1 style="margin:0 0 10px;font-size:19px">The prototype did not load completely</h1>
        <p style="color:var(--ink-2);font-size:13.5px;margin:0 0 12px">
          ${missing.length === 1 ? 'This file' : 'These files'} could not be loaded:</p>
        <div class="te-call mono">${missing.map(esc).join('<br>')}</div>
        <p style="color:var(--ink-3);font-size:12.5px;margin:12px 0 0">
          They must sit in the same folder as <span class="mono">index.html</span>. If they are
          there, it is almost certainly a cached page — reload with
          <b>Ctrl&nbsp;+&nbsp;Shift&nbsp;+&nbsp;R</b>.</p>
      </div>`;
    return;
  }
  S = seed();
  (function fixSeedHashes(){
    S.requests.forEach(r=>{
      const h=taskConfigHash(r);
      r.approvals.forEach(a=>{ if(a.hash===null) a.hash=h; });
    });
  })();
  render();
}
</script>
