<title>Task Request Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --ground:#F5F7F9; --surface:#FFFFFF; --surface-2:#EEF1F5; --surface-3:#E4E9EF;
  --border:#DCE3EA; --border-strong:#BFC9D4;
  --ink:#131A21; --ink-2:#4A5765; --ink-3:#78858F;
  --accent:#1B5FA8; --accent-ink:#FFFFFF; --accent-soft:#E8F0F8; --accent-line:#A9C6E4;
  --ok:#1B7A4B; --ok-soft:#E3F2EA; --ok-line:#A8D6BE; --on-ok:#FFFFFF;
  --warn:#8A6317; --warn-soft:#F7F0DC; --warn-line:#DCC489;
  --bad:#A83B22; --bad-soft:#F9EAE5; --bad-line:#E3B3A2;
  --shadow-1:0 1px 2px rgba(19,26,33,.06);
  --shadow-2:0 2px 4px rgba(19,26,33,.06),0 8px 24px rgba(19,26,33,.08);
  --shadow-3:0 8px 16px rgba(19,26,33,.10),0 24px 56px rgba(19,26,33,.18);
  --r:6px; --r-lg:10px;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono","Consolas",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1317; --surface:#161D23; --surface-2:#1D262E; --surface-3:#26313A;
    --border:#2A343D; --border-strong:#3D4A56;
    --ink:#E3E9EE; --ink-2:#A5B2BE; --ink-3:#7A8792;
    --accent:#5B9BE8; --accent-ink:#0B1015; --accent-soft:#17242F; --accent-line:#2F4D6B;
    --ok:#4FBE85; --ok-soft:#122319; --ok-line:#255E42; --on-ok:#0B1015;
    --warn:#D8AE5A; --warn-soft:#241E11; --warn-line:#5C4A22;
    --bad:#E47B5C; --bad-soft:#291712; --bad-line:#633324;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
    --shadow-3:0 8px 16px rgba(0,0,0,.5),0 24px 56px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1317; --surface:#161D23; --surface-2:#1D262E; --surface-3:#26313A;
  --border:#2A343D; --border-strong:#3D4A56;
  --ink:#E3E9EE; --ink-2:#A5B2BE; --ink-3:#7A8792;
  --accent:#5B9BE8; --accent-ink:#0B1015; --accent-soft:#17242F; --accent-line:#2F4D6B;
  --ok:#4FBE85; --ok-soft:#122319; --ok-line:#255E42; --on-ok:#0B1015;
  --warn:#D8AE5A; --warn-soft:#241E11; --warn-line:#5C4A22;
  --bad:#E47B5C; --bad-soft:#291712; --bad-line:#633324;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --shadow-3:0 8px 16px rgba(0,0,0,.5),0 24px 56px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .mark{
  width:24px;height:24px;border-radius:5px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:none;
}
.brand .sub{color:var(--ink-3);font-weight:400;font-size:12px;
  padding-left:10px;margin-left:2px;border-left:1px solid var(--border)}
.topnav{display:flex;gap:2px;margin-left:8px}
.topnav button{
  background:none;border:0;padding:7px 11px;border-radius:var(--r);color:var(--ink-2);
  cursor:pointer;font-weight:500;
}
.topnav button:hover{background:var(--surface-2);color:var(--ink)}
.topnav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}

.userswitch{display:flex;align-items:center;gap:8px}
.userswitch>span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.avatars{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:var(--r)}
.avatar{
  width:28px;height:28px;border-radius:5px;border:0;cursor:pointer;
  background:transparent;color:var(--ink-3);font-size:11px;font-weight:600;
  font-family:var(--mono);
}
.avatar:hover{background:var(--surface-3);color:var(--ink)}
.avatar[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{
  background:none;border:1px solid transparent;border-radius:var(--r);
  width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

.main{flex:1;padding:22px 16px 72px;max-width:1220px;margin:0 auto;width:100%}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
  font-weight:500;cursor:pointer;white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.go:hover:not(:disabled){filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;border:1px solid;
  text-transform:uppercase;white-space:nowrap;
}
.pill.neutral{background:var(--surface-2);border-color:var(--border);color:var(--ink-2)}
.pill.blue{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.pill.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 4px 2px 8px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--ink-2);
}
.chip button{background:none;border:0;cursor:pointer;color:var(--ink-3);
  width:16px;height:16px;border-radius:50%;display:grid;place-items:center;padding:0;line-height:1}
.chip button:hover{background:var(--surface-3);color:var(--ink)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;
  color:var(--ink-2);cursor:pointer;font-weight:500;margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .count{color:var(--ink-3);font-weight:400;font-family:var(--mono);font-size:12px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:11.5px;color:var(--ink-3)}
input[type=text],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);
  padding:7px 9px;width:100%;
}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
.req{color:var(--bad)}

.empty{padding:26px;text-align:center;color:var(--ink-3);border:1px dashed var(--border-strong);
  border-radius:var(--r-lg);font-size:13px}

/* ---------- tips popover ---------- */
.tipwrap{position:relative;display:flex}
.iconbtn.accent{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line);position:relative}
.iconbtn.accent:hover{background:var(--accent-soft);filter:brightness(.97)}
.iconbtn.accent::after{
  content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 2px var(--surface);animation:nudge 2.4s ease-in-out infinite;
}
.iconbtn.accent.seen::after{display:none}
@keyframes nudge{0%,100%{opacity:1}50%{opacity:.3}}
.tip{
  position:absolute;top:40px;right:0;width:330px;z-index:60;padding:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);
}
.tip h3{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.tip ol{margin:0;padding-left:17px;color:var(--ink-2);font-size:13px;display:grid;gap:7px}
.tip ol b{color:var(--ink);font-weight:600}
.tip .tipfoot{margin-top:12px;padding-top:11px;border-top:1px solid var(--border);
  font-size:12px;color:var(--ink-3);line-height:1.55}

/* ---------- inbox ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:21px;letter-spacing:-.02em;text-wrap:balance}
.page-head p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters select{width:auto;padding:5px 8px;font-size:13px}
.rows{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.row{display:flex;gap:14px;padding:13px 15px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .rmain{flex:1;min-width:0}
.row .rtitle{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row .rtitle .id{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.row .rtitle strong{font-weight:600;letter-spacing:-.01em}
.row .rmeta{margin-top:4px;font-size:12.5px;color:var(--ink-3);display:flex;gap:7px;flex-wrap:wrap}
.row .rmeta .dot{color:var(--border-strong)}
.row .rside{text-align:right;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-top:2px}

/* ---------- request editor ---------- */
.rq-head{margin-bottom:16px}
.backlink{background:none;border:0;padding:0;color:var(--ink-3);cursor:pointer;font-size:13px;
  display:inline-flex;align-items:center;gap:5px;margin-bottom:9px}
.backlink:hover{color:var(--accent)}
.rq-title{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.rq-title h1{margin:0;font-size:22px;letter-spacing:-.02em}
.rq-sub{margin-top:5px;color:var(--ink-3);font-size:13px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rq-actions{display:flex;gap:8px;align-items:center;margin-left:auto}

.rq-body{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:20px;align-items:start}
@media (max-width:900px){.rq-body{grid-template-columns:1fr}}

/* task cards */
.tasklist{display:grid;gap:10px}
.task{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--shadow-1);overflow:hidden}
.task.failed{border-color:var(--bad-line)}
.task-top{display:flex;gap:11px;padding:12px 13px;align-items:flex-start}
.task-ico{width:30px;height:30px;border-radius:var(--r);background:var(--surface-2);
  display:grid;place-items:center;color:var(--ink-2);flex:none}
.task.failed .task-ico{background:var(--bad-soft);color:var(--bad)}
.task-main{flex:1;min-width:0}
.task-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task-name strong{font-weight:600}
.task-cfg{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.kv{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);
  padding:1px 6px;border-radius:4px;color:var(--ink-2)}
.kv b{color:var(--ink);font-weight:500}
.task-note{margin-top:7px;font-size:12.5px;color:var(--ink-3)}
.task-err{margin-top:8px;padding:8px 10px;background:var(--bad-soft);border:1px solid var(--bad-line);
  border-radius:var(--r);font-size:12.5px;color:var(--bad);display:flex;gap:7px;align-items:flex-start}
.task-err .mono{font-size:11.5px}
.task.waiting{border-color:var(--warn-line)}
.task.waiting .task-ico{background:var(--warn-soft);color:var(--warn)}
.task-wait{margin-top:8px;padding:9px 10px;background:var(--warn-soft);border:1px solid var(--warn-line);
  border-radius:var(--r);font-size:12.5px;color:var(--warn);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.task-wait .wi{flex:none;display:grid;place-items:center}
.task-wait .mono{font-size:11.5px}
.task-acts{display:flex;gap:1px;flex:none;margin-left:6px}
.task-acts .ico{
  width:28px;height:28px;padding:0;justify-content:center;border-color:transparent;
  background:transparent;color:var(--ink-3);position:relative;
}
.task-acts .ico:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.task-acts .ico .n{position:absolute;top:2px;right:3px;font-family:var(--mono);font-size:9px;line-height:1;
  color:var(--ink-3)}

.addbar{margin-top:12px}

/* right rail */
.rail{display:grid;gap:12px;position:sticky;top:72px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.panel-head h3{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.panel-body{padding:11px 13px;display:grid;gap:9px}
.approver{display:flex;align-items:center;gap:9px;font-size:13px}
.approver .av{width:24px;height:24px;border-radius:5px;background:var(--surface-2);
  display:grid;place-items:center;font-size:10.5px;font-weight:600;font-family:var(--mono);
  color:var(--ink-2);flex:none;border:1px solid var(--border)}
.approver.did .av{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.approver.stale .av{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.approver .who{flex:1;min-width:0}
.approver .who small{display:block;color:var(--ink-3);font-size:11.5px}

/* gate */
.gate{margin-top:18px;border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden}
.gate.open{border-color:var(--ok-line)}
.gate.parked{border-color:var(--warn-line)}
.gate-bar{display:flex;align-items:center;gap:10px;padding:9px 11px 9px 13px;flex-wrap:wrap}
.gate.open .gate-bar{background:var(--ok-soft)}
.gate.parked .gate-bar{background:var(--warn-soft)}
.gate.parked .gate-toggle .gi{color:var(--warn)}
.gate-toggle{
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;
  background:none;border:0;padding:4px 2px;border-radius:var(--r);cursor:pointer;
  color:var(--ink);font-weight:600;
}
.gate-toggle:hover{color:var(--accent)}
.gate-toggle .gi{flex:none;display:grid;place-items:center;color:var(--warn)}
.gate.open .gate-toggle .gi{color:var(--ok)}
.gate-toggle .gsub{font-weight:400;color:var(--ink-3);font-size:12.5px}
.gate-toggle .chev{flex:none;display:grid;place-items:center;color:var(--ink-3);transition:transform .15s}
.gate-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.gate-detail{border-top:1px solid var(--border);background:var(--surface-2)}
.gate.open .gate-detail{border-color:var(--ok-line)}
.gate-rules{padding:11px 14px;display:grid;gap:8px}
.grule{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.grule .gi{flex:none;margin-top:1px}
.grule.pass .gi{color:var(--ok)}
.grule.fail .gi{color:var(--bad)}
.grule .gt{flex:1}
.grule .gr{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.gate-foot{padding:9px 14px;border-top:1px solid var(--border)}
.gate-foot .hash{font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:help}

/* data tab */
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;
  padding:15px;max-width:720px}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{width:36px;height:20px;border-radius:20px;background:var(--surface-3);
  border:1px solid var(--border-strong);position:relative;transition:background .15s,border-color .15s;flex:none}
.track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow-1);transition:transform .15s}
.switch input:checked+.track{background:var(--ok);border-color:var(--ok)}
.switch input:checked+.track::after{transform:translateX(16px)}

/* conversation */
.thread{display:grid;gap:11px;padding:15px;max-width:760px}
.msg{display:flex;gap:10px}
.msg .av{width:28px;height:28px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;font-size:11px;font-weight:600;font-family:var(--mono);color:var(--ink-2);flex:none}
.msg .bubble{flex:1;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.msg .bhead{padding:6px 11px;background:var(--surface-2);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--ink-3);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.msg .bhead b{color:var(--ink);font-weight:600}
.msg .bhead .btn.sm{margin:-3px -4px -3px 0;font-size:12px}
.msg.is-cr .bubble{border-color:var(--warn-line)}
.msg.is-cr .bhead{background:var(--warn-soft)}
.msg.is-cr.done .bubble{border-color:var(--border)}
.msg.is-cr.done .bhead{background:var(--surface-2)}
.msg .btext{padding:9px 11px;font-size:13.5px}
.composer{display:grid;gap:8px;padding:13px;border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface)}
.composer .fake-toolbar{display:flex;gap:3px;padding-bottom:7px;border-bottom:1px solid var(--border);color:var(--ink-3)}
.composer .fake-toolbar span{width:24px;height:22px;display:grid;place-items:center;border-radius:4px;font-size:12px}
.composer textarea{border:0;padding:0;resize:vertical;min-height:56px}
.composer textarea:focus{box-shadow:none}
.composer .crow{display:flex;gap:8px;justify-content:flex-end}

/* history */
.hist{padding:6px 0}
.hevent{display:flex;gap:11px;padding:9px 15px;font-size:13px;align-items:flex-start}
.hevent .hdot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);margin-top:6px;flex:none}
.hevent .ht{flex:1}
.hevent .hw{color:var(--ink-3);font-size:12px;white-space:nowrap;font-family:var(--mono)}

/* ---------- definition editor ---------- */
.def-body{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.def-body{grid-template-columns:1fr}}
.sidenav{display:grid;gap:1px}
.sidenav button{text-align:left;background:none;border:0;padding:8px 11px;border-radius:var(--r);
  color:var(--ink-2);cursor:pointer;font-weight:500}
.sidenav button:hover{background:var(--surface-2);color:var(--ink)}
.sidenav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.graph{padding:16px;overflow-x:auto}
.rulecard{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:9px}
.rulecard-top{display:flex;gap:11px;align-items:center;padding:9px 11px}
.rulecard-num{width:22px;height:22px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
.rulecard-body{padding:0 11px 11px 44px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.rulecard-body input[type=number]{width:60px}
.rulecard-body select{width:auto}

/* ---------- dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,19,23,.55);display:grid;place-items:center;
  z-index:100;padding:20px;overflow:auto}
.dialog{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-3);width:100%;max-width:520px;overflow:hidden;margin:auto}
.dialog.wide{max-width:680px}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.dhead h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}
.dbody{padding:16px;display:grid;gap:14px;max-height:62vh;overflow:auto}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);
  background:var(--surface-2)}
/* what a signer is shown before they sign */
.ctxbox{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:11px 12px}
.ctxbox h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.ctxgrp+.ctxgrp{margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.ctxgrp b{font-size:12.5px}
.ctxrow{display:flex;gap:10px;justify-content:space-between;font-size:12.5px;margin-top:3px}
.ctxrow>span:first-child{color:var(--ink-3)}
.ctxrow .mono{font-size:11.5px;text-align:right;word-break:break-all}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
.tile{border:1px solid var(--border-strong);border-radius:var(--r-lg);background:var(--surface);
  padding:14px 12px;cursor:pointer;text-align:left;display:grid;gap:6px}
.tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.tile .ti{width:30px;height:30px;border-radius:var(--r);background:var(--surface-2);
  display:grid;place-items:center;color:var(--accent)}
.tile b{font-weight:600}
.tile small{color:var(--ink-3);font-size:12px;line-height:1.4}

.logrow{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.logrow+.logrow{margin-top:9px}
.loghead{display:flex;gap:10px;align-items:center;padding:8px 11px;background:var(--surface-2);
  border-bottom:1px solid var(--border);font-size:12.5px;flex-wrap:wrap}
.loghead .mono{color:var(--ink-3);font-size:11.5px}
.logbody{padding:9px 11px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;
  background:var(--ink);color:var(--ground);padding:9px 15px;border-radius:20px;
  box-shadow:var(--shadow-3);font-size:13px;font-weight:500;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-3px)}

.footnote{max-width:1220px;margin:26px auto 0;padding:14px 16px;color:var(--ink-3);font-size:12.5px;
  border-top:1px solid var(--border);line-height:1.6}
.footnote b{color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Deterministic stand-in for the SHA-256 taskConfigHash in the spec. */
function fnv(str){
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<str.length;i++){
    h1=(h1^str.charCodeAt(i))>>>0; h1=(h1*0x01000193)>>>0;
    h2=(h2+str.charCodeAt(i)*(i+7))>>>0;
  }
  return (h1.toString(16)+h2.toString(16)).padStart(12,'0').slice(0,12);
}
function taskConfigHash(items){
  return fnv(JSON.stringify(items.map(t=>({d:t.def,c:t.config}))));
}

/* A run is in flight while it is working or parked on a work item. */
function runInFlight(r){ return !!r.run && (r.run.state==='RUNNING' || r.run.state==='WAITING'); }
function openWorkItems(r){ return (r.workItems||[]).filter(w=>w.state==='OPEN'); }
function myWorkItems(r,user){
  return openWorkItems(r).filter(w=>w.roles.some(ro=>hasRole(user,ro)));
}
function eligibleFor(w){ return USER_ORDER.filter(u=>w.roles.some(ro=>hasRole(u,ro))); }
function stamp(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2100);
}

/* ============================ rule engine ============================ */
/* Mirrors evaluateRule() from the specification, reasons included. */
function evaluateRule(rule,r){
  const hash = taskConfigHash(r.taskItems);
  switch(rule.kind){
    case 'approvals':{
      const roles = rule.roles||[];
      const valid = r.approvals.filter(a=>
        a.decision==='APPROVED' &&
        a.hash===hash &&
        (!roles.length || roles.some(ro=>hasRole(a.user,ro))) &&
        (!rule.excludeRequester || a.user!==r.requester));
      const dismissed = r.approvals.filter(a=>a.decision==='APPROVED' && a.hash!==hash).length;
      const label = `${rule.min} approval${rule.min===1?'':'s'}`
        + (roles.length?` from ${roles.join(' or ')}`:'')
        + (rule.excludeRequester?' (not the requester)':'');
      let reason = `${valid.length} of ${rule.min} so far`;
      if(dismissed) reason += ` — ${dismissed} dismissed because a task was edited after signing off`;
      return {label, satisfied: valid.length>=rule.min, reason};
    }
    case 'noUnresolvedChangeRequests':{
      const open = r.changeRequests.filter(c=>!c.resolved).length;
      return {label:'No unresolved change requests', satisfied:open===0,
              reason: open?`${open} still open`:'all resolved'};
    }
    case 'allTasksSucceeded':{
      const bad = r.taskItems.filter(t=>t.status!=='SUCCEEDED').length;
      return {label:'Every task has run successfully', satisfied:bad===0,
              reason: bad?`${bad} not yet successful`:'all succeeded'};
    }
    case 'data':{
      const v = r.data[rule.path];
      const param = S.definition.dataParameters.find(p=>p.name===rule.path);
      const ok = rule.op==='truthy' ? !!v : v===rule.value;
      return {label:`${param?param.label:rule.path} must be set`, satisfied:ok,
              reason: ok?'confirmed':'not confirmed yet'};
    }
    default: return {label:rule.kind, satisfied:false, reason:'unknown rule'};
  }
}
function evaluateGate(r){
  const rules = S.definition.rules.map(rule=>evaluateRule(rule,r));
  const noTasks = r.taskItems.length===0;
  return {
    rules,
    hash: taskConfigHash(r.taskItems),
    noTasks,
    canExecute: !noTasks && rules.every(x=>x.satisfied) && r.status!=='ARCHIVED' && r.status!=='REJECTED',
  };
}

/* ============================ render: inbox ============================ */
function inboxFilter(){
  const m=S.me;
  /* The human task list. In the real API this is GET /workitems?assignedToMe —
     a query over work items, not over requests. */
  if(S.inboxTab==='action'){
    return S.requests.filter(r=>myWorkItems(r,m).length>0);
  }
  if(S.inboxTab==='awaiting'){
    return S.requests.filter(r=>{
      if(r.requester===m) return false;
      if(r.status!=='OPEN') return false;
      const hash=taskConfigHash(r.taskItems);
      return !r.approvals.some(a=>a.user===m && a.hash===hash);
    });
  }
  if(S.inboxTab==='mine')   return S.requests.filter(r=>r.requester===m);
  if(S.inboxTab==='open')   return S.requests.filter(r=>r.status==='OPEN'||r.status==='APPROVED');
  return S.requests;
}
function viewInbox(){
  const counts = {
    awaiting: (()=>{const t=S.inboxTab; S.inboxTab='awaiting'; const n=inboxFilter().length; S.inboxTab=t; return n;})(),
    action:   S.requests.reduce((n,r)=>n+myWorkItems(r,S.me).length,0),
    mine:     S.requests.filter(r=>r.requester===S.me).length,
    open:     S.requests.filter(r=>r.status==='OPEN'||r.status==='APPROVED').length,
  };
  const list = inboxFilter();
  return `
  <div class="page-head">
    <div>
      <h1>Task Requests</h1>
      <p>Changes waiting to be reviewed, approved and carried out.</p>
    </div>
    <button class="btn primary" data-act="new-request">${I.plus} New task request</button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${S.inboxTab==='action'}"   data-tab="action">Awaiting my action
      ${counts.action?`<span class="pill warn">${counts.action}</span>`:`<span class="count">0</span>`}</button>
    <button role="tab" aria-selected="${S.inboxTab==='awaiting'}" data-tab="awaiting">Awaiting my approval <span class="count">${counts.awaiting}</span></button>
    <button role="tab" aria-selected="${S.inboxTab==='mine'}"     data-tab="mine">My requests <span class="count">${counts.mine}</span></button>
    <button role="tab" aria-selected="${S.inboxTab==='open'}"     data-tab="open">All open <span class="count">${counts.open}</span></button>
    <button role="tab" aria-selected="${S.inboxTab==='all'}"      data-tab="all">Everything <span class="count">${S.requests.length}</span></button>
  </div>
  ${list.length ? `<div class="rows">${list.map(inboxRow).join('')}</div>`
    : `<div class="empty">Nothing here for ${esc(me().name)} right now. Try another tab, or switch user.</div>`}`;
}
function inboxRow(r){
  const gate = evaluateGate(r);
  const failed = r.taskItems.filter(t=>t.status==='FAILED').length;
  const appr = S.definition.rules.find(x=>x.kind==='approvals');
  const hash = taskConfigHash(r.taskItems);
  const good = r.approvals.filter(a=>a.decision==='APPROVED'&&a.hash===hash).length;
  const openCr = r.changeRequests.filter(c=>!c.resolved).length;
  const mine = myWorkItems(r,S.me).length;
  const parked = r.run && r.run.state==='WAITING';
  const bits = [`${r.taskItems.length} task${r.taskItems.length===1?'':'s'}`];
  if(appr) bits.push(`${good} of ${appr.min} approvals`);
  if(openCr) bits.push(`${openCr} open change request${openCr===1?'':'s'}`);
  if(failed) bits.push(`${failed} failed execution${failed===1?'':'s'}`);
  else if(parked) bits.push(mine?'waiting for your signature':'waiting for a signature');
  else if(gate.canExecute) bits.push('ready to execute');
  return `<div class="row" data-open="${r.id}" tabindex="0" role="button">
    <div class="rmain">
      <div class="rtitle">
        ${mine?`<span class="pill warn">${I.pause} your turn</span>`:''}
        <span class="pill ${STATUS_TONE[r.status]}">${r.status}</span>
        <span class="id mono">${r.id}</span>
        <strong>${esc(r.name)}</strong>
        ${failed?`<span class="pill bad">${I.warn} failed</span>`:''}
      </div>
      <div class="rmeta">${bits.map((b,i)=>`${i?'<span class="dot">·</span>':''}<span>${esc(b)}</span>`).join('')}</div>
    </div>
    <div class="rside">${esc(S.definition.name)}<br>${esc(USERS[r.requester].name)}</div>
  </div>`;
}

function paneTasks(r,gate){
  /* A run in flight freezes the plan: the hash it is executing must not move
     under it, or half a plan runs under terms nobody approved. */
  const locked = r.status==='ARCHIVED'||r.status==='REJECTED'||runInFlight(r);
  return `<div class="tasklist">
    ${r.taskItems.length? r.taskItems.map(t=>taskCard(r,t,locked)).join('')
      : `<div class="empty">No tasks yet. A request needs at least one task before it can be executed.</div>`}
  </div>
  <div class="addbar">
    <button class="btn" data-act="add-task" ${locked?'disabled':''}>${I.plus} Add task</button>
  </div>
  ${gateBox(r,gate)}`;
}
function taskCard(r,t,locked){
  const def = TASK_DEFS[t.def];
  const tone = {NOT_RUN:'neutral',RUNNING:'blue',WAITING:'warn',SUCCEEDED:'ok',FAILED:'bad'}[t.status];
  const label= {NOT_RUN:'not run',RUNNING:'running…',WAITING:'waiting for a person',
                SUCCEEDED:'succeeded',FAILED:'failed'}[t.status];
  const taskLogs = r.logs.filter(l=>l.taskId===t.id);
  const last = taskLogs.slice(-1)[0];
  const logCount = taskLogs.length;
  const w = (r.workItems||[]).find(x=>x.taskItemId===t.id && x.state==='OPEN');
  const canSign = w && w.roles.some(ro=>hasRole(S.me,ro));
  return `<article class="task ${t.status==='FAILED'?'failed':''} ${t.status==='WAITING'?'waiting':''}">
    <div class="task-top">
      <div class="task-ico">${def.icon}</div>
      <div class="task-main">
        <div class="task-name">
          <strong>${esc(def.label)}</strong>
          ${def.manual?`<span class="pill neutral" title="No server executor — a person closes this one">manual</span>`:''}
          <span class="pill ${tone}">${t.status==='RUNNING'?I.spin:''}${label}</span>
          ${t.attempts>1?`<span class="pill neutral">attempt ${t.attempts}</span>`:''}
        </div>
        <div class="task-cfg">
          ${def.params.filter(p=>t.config[p.name]).map(p=>
            `<span class="kv">${esc(p.label)} <b>${esc(t.config[p.name])}</b></span>`).join('')}
        </div>
        ${last && t.status==='SUCCEEDED' ? `<div class="task-note">ran ${esc(last.at)} by ${esc(USERS[last.by].name)}${
          last.onBehalfOf?` on behalf of ${esc(USERS[last.onBehalfOf].name)}`:''}</div>`:''}
        ${w ? `<div class="task-wait">
            <span class="wi">${I.pause}</span>
            <div style="flex:1">
              <div><b>Execution is parked here.</b> Waiting for ${esc(w.roles.join(' or '))} —
                ${eligibleFor(w).map(u=>esc(USERS[u].name)).join(', ')}${w.dueAt?` · due ${esc(w.dueAt)}`:''}</div>
              <div style="margin-top:2px;opacity:.85">Work item <span class="mono">${esc(w.id)}</span> · the run resumes the moment it closes.</div>
            </div>
            ${canSign?`<button class="btn sm go" data-act="sign" data-id="${w.id}">${I.pen} Sign</button>`
                     :`<span class="pill neutral">not yours to sign</span>`}
          </div>`:''}
        ${t.status==='FAILED'? `<div class="task-err">${I.warn}<div>
            <div><b>Execution failed.</b> ${esc(t.error||'')}</div>
            <div class="mono" style="margin-top:3px;opacity:.85">de.aixpertsoft.taskrequest.actions.CablePatchAction:118</div>
          </div></div>`:''}
      </div>
      <div class="task-acts">
        <button class="btn sm ico" data-act="config-task" data-id="${t.id}" ${locked?'disabled':''}
          title="Configure this task" aria-label="Configure this task">${I.gear}</button>
        <button class="btn sm ico" data-act="run-one" data-id="${t.id}"
          ${def.manual||runInFlight(r)?'disabled':''}
          title="${def.manual?'Manual tasks are closed by a person':t.status==='FAILED'?'Re-run this task':'Run this task on its own'}"
          aria-label="Run this task on its own">${t.status==='FAILED'?I.rerun:I.play}</button>
        <button class="btn sm ico" data-act="show-log" data-id="${t.id}"
          title="Execution log" aria-label="Execution log">${I.log}${logCount?`<span class="n">${logCount}</span>`:''}</button>
        <button class="btn sm ico" data-act="del-task" data-id="${t.id}" ${locked?'disabled':''}
          title="Remove this task" aria-label="Remove this task">${I.trash}</button>
      </div>
    </div>
  </article>`;
}

function panelApprovals(r,gate){
  const hash = gate.hash;
  const rule = S.definition.rules.find(x=>x.kind==='approvals');
  const good = r.approvals.filter(a=>a.decision==='APPROVED'&&a.hash===hash&&
    (!rule||!rule.roles.length||rule.roles.some(ro=>hasRole(a.user,ro)))&&
    (!rule||!rule.excludeRequester||a.user!==r.requester));
  const mine = r.approvals.find(a=>a.user===S.me);
  const isRequester = r.requester===S.me;
  const canApprove = !isRequester && (!rule||!rule.roles.length||rule.roles.some(ro=>hasRole(S.me,ro)))
                     && r.status==='OPEN';

  const rows = USER_ORDER.filter(u=>u!==r.requester).map(u=>{
    const a = r.approvals.find(x=>x.user===u);
    const stale = a && a.hash!==hash;
    const eligible = !rule||!rule.roles.length||rule.roles.some(ro=>hasRole(u,ro));
    let note = eligible ? USERS[u].roles.join(', ') : `${USERS[u].roles.join(', ')} — cannot approve this type`;
    if(a) note = stale ? 'dismissed — a task was edited' : (a.decision==='APPROVED'?`approved ${a.at}`:`rejected ${a.at}`);
    return `<div class="approver ${a&&!stale&&a.decision==='APPROVED'?'did':''} ${stale?'stale':''}">
      <span class="av">${a&&!stale?(a.decision==='APPROVED'?I.check:I.cross):USERS[u].initials}</span>
      <span class="who">${esc(USERS[u].name)}<small>${esc(note)}</small></span>
    </div>`;
  }).join('');

  return `<section class="panel">
    <div class="panel-head">
      <h3>Approvals</h3>
      <span class="pill ${rule&&good.length>=rule.min?'ok':'neutral'}">${good.length} of ${rule?rule.min:0}</span>
    </div>
    <div class="panel-body">
      ${rows}
      <div class="approver" style="opacity:.65">
        <span class="av">${USERS[r.requester].initials}</span>
        <span class="who">${esc(USERS[r.requester].name)}<small>requester — cannot approve their own</small></span>
      </div>
      ${canApprove
        ? (mine && mine.hash===hash
            ? `<button class="btn sm" data-act="unapprove" style="width:100%;justify-content:center">Withdraw my ${mine.decision==='APPROVED'?'approval':'rejection'}</button>`
            : `<div style="display:flex;gap:6px">
                 <button class="btn sm go" data-act="approve" style="flex:1;justify-content:center">${I.check} Approve</button>
                 <button class="btn sm" data-act="reject" style="justify-content:center">Reject</button>
               </div>`)
        : `<div class="hint" style="font-size:11.5px;color:var(--ink-3)">
             ${isRequester?'You opened this request, so you cannot approve it.'
               : r.status!=='OPEN' ? `Approvals are closed while the request is ${r.status}.`
               : `${esc(me().name)} does not hold a role that may approve this request type.`}
           </div>`}
    </div>
  </section>`;
}


function gateBox(r,gate){
  const running = r.taskItems.some(t=>t.status==='RUNNING');
  const checks = [
    ...(gate.noTasks?[{label:'At least one task', satisfied:false, reason:'this request has none yet'}]:[]),
    ...gate.rules,
  ];
  const todo = checks.filter(x=>!x.satisfied).length;
  const waiting = r.run && r.run.state==='WAITING' ? openWorkItems(r)[0] : null;
  const allDone = r.taskItems.length>0 && r.taskItems.every(t=>t.status==='SUCCEEDED');

  /* Three states share this bar: a run parked on a person, a run working,
     and no run at all — where the gate decides whether one may start. */
  const head = waiting
    ? `<span class="gi pausing">${I.pause}</span>
       <span>Waiting for a signature <span class="gsub">— ${esc(eligibleFor(waiting).map(u=>USERS[u].name).join(' or '))}${
         waiting.dueAt?`, due ${esc(waiting.dueAt)}`:''}</span></span>`
    : allDone
    ? `<span class="gi">${I.check}</span><span>All tasks completed <span class="gsub">— nothing left to run</span></span>`
    : gate.canExecute
    ? `<span class="gi">${I.check}</span><span>Ready to execute <span class="gsub">— all ${checks.length} checks passed</span></span>`
    : `<span class="gi">${I.warn}</span><span>${todo} thing${todo===1?'':'s'} still ${todo===1?'needs':'need'} doing <span class="gsub">— before this request may run</span></span>`;

  const action = waiting
    ? `<button class="btn ghost" data-act="cancel-run"
         title="Abandon the run and unlock the request for editing">Cancel run</button>`
    : `<button class="btn ${gate.canExecute&&!allDone?'go':''}" data-act="run-all"
         ${gate.canExecute&&!running&&!allDone&&!runInFlight(r)?'':'disabled'}
         title="${gate.canExecute?'Run every task that has not succeeded yet':'Blocked until every check passes'}">
         ${running?I.spin+' Running…':I.play+' Execute all tasks'}
       </button>`;

  return `<section class="gate ${waiting?'parked':gate.canExecute?'open':''}">
    <div class="gate-bar">
      <button class="gate-toggle" data-act="toggle-gate" aria-expanded="${S.gateOpen}" aria-controls="gate-detail">
        ${head}
        <span class="chev">${I.chevD}</span>
      </button>
      ${action}
    </div>
    ${S.gateOpen?`<div class="gate-detail" id="gate-detail">
      <div class="gate-rules">
        ${checks.map(x=>`<div class="grule ${x.satisfied?'pass':'fail'}">
          <span class="gi">${x.satisfied?I.check:I.cross}</span>
          <span class="gt">${esc(x.label)}<div class="gr">${esc(x.reason)}</div></span>
        </div>`).join('')}
      </div>
      <div class="gate-foot">
        <span class="hash" title="A fingerprint of every task and its settings. Edit a task and it changes — which is what dismisses approvals given for the old one.">fingerprint ${gate.hash}</span>
        ${r.run?`<span class="hash" style="margin-left:12px"
          title="A run is bound to the fingerprint it started on, and freezes the plan until it ends.">run ${esc(r.run.id)} · ${esc(r.run.state.toLowerCase())} · step ${Math.min(r.run.cursor+1,r.taskItems.length)} of ${r.taskItems.length} · started by ${esc(USERS[r.run.startedBy].name)}</span>`:''}
      </div>
    </div>`:''}
  </section>`;
}

/* ============================ mutations ============================ */
function note(r,text,who){ r.history.push({at:stamp(),who:who||S.me,text}); }

function approve(decision){
  const r=req(); const hash=taskConfigHash(r.taskItems);
  r.approvals = r.approvals.filter(a=>a.user!==S.me);
  r.approvals.push({id:'a'+(++S.seq), user:S.me, decision, at:stamp(), hash});
  note(r, decision==='APPROVED'?'approved this request':'rejected this request');
  r.version++;
  render(); toast(decision==='APPROVED'?'Approved':'Rejected');
}
function unapprove(){
  const r=req();
  r.approvals = r.approvals.filter(a=>a.user!==S.me);
  note(r,'withdrew their review'); r.version++;
  render(); toast('Withdrawn');

/* ---------------------------------------------------------------
   Execution runs.

   A run walks the task list with a cursor. An automatic task is
   dispatched to its executor; a manual task creates a work item and
   the run parks itself until a human closes it. Completing the work
   item resumes the same run — there is no "continue" button, because
   in every engine that does this well the completion *is* the resume.
   --------------------------------------------------------------- */

/* One task item, dispatched. Returns true if it succeeded. */
async function runOneTask(r,t,actor){
  const d = TASK_DEFS[t.def];
  t.status='RUNNING'; render();
  await sleep(520);
  t.attempts++;
  const fails = t.def==='cablePatch'
    && t.config.operation==='Connect'
    && OCCUPIED_PORTS.includes((t.config.targetPort||'').trim());
  if(fails){
    t.status='FAILED';
    t.error=`Port ${t.config.targetPort} is already carrying cable CBL-88213.`;
    r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), outcome:'FAILED', ms:1380, ...actor,
      detail:`BusinessLogicError: Port ${t.config.targetPort} is already carrying cable CBL-88213.\n`
           + `  at de.aixpertsoft.taskrequest.actions.CablePatchAction.perform(CablePatchAction.java:118)\n`
           + `  at de.aixpertsoft.action.ActionExecutor.run(ActionExecutor.java:64)`});
    note(r,`ran ${d.label} — failed`, actor.by);
    render();
    return false;
  }
  t.status='SUCCEEDED'; t.error=null;
  t.outputs = d.outputs ? d.outputs(t.config,r) : null;
  r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), outcome:'SUCCEEDED', ms:410, ...actor,
    detail:`${d.label} completed — ${d.summary(t.config)}`
         + (t.outputs?`\noutputs:\n`+Object.entries(t.outputs).map(([k,v])=>`  ${k}: ${v}`).join('\n'):'')});
  note(r,`ran ${d.label} — succeeded`, actor.by);
  render();
  return true;
}

/* Everything a preceding task handed forward — the payload a signer is shown. */
function priorOutputs(r,upTo){
  return r.taskItems.slice(0,upTo)
    .filter(t=>t.outputs)
    .map(t=>({label:TASK_DEFS[t.def].label, outputs:t.outputs}));
}

function startRun(){
  const r=req();
  const gate=evaluateGate(r);
  /* The server re-evaluates the gate; the button state is only a hint. */
  if(!gate.canExecute){
    S.gateOpen=true; render();
    toast('The server refused: rules are not satisfied'); return;
  }
  if(runInFlight(r)){ toast('A run is already in progress'); return; }
  r.run = {id:'run'+(++S.seq), state:'RUNNING', cursor:0, hash:gate.hash,
           startedBy:S.me, startedAt:stamp(), waitingOn:null, resumed:false, triggeredBy:null};
  note(r,'started an execution run');
  driveRun(r);
}

async function driveRun(r){
  const run=r.run; if(!run) return;
  run.state='RUNNING'; render();
  while(run.cursor < r.taskItems.length){
    const t = r.taskItems[run.cursor];
    if(t.status==='SUCCEEDED'){ run.cursor++; continue; }
    const d = TASK_DEFS[t.def];

    if(d.manual){
      const w = {id:'wi'+(++S.seq), runId:run.id, taskItemId:t.id,
        title:t.config.document||d.label, roles:[t.config.signerRole||'Administrator'],
        dueAt:t.config.dueBy||null, state:'OPEN', createdAt:stamp(),
        context:priorOutputs(r,run.cursor), result:null};
      r.workItems.push(w);
      t.status='WAITING';
      run.state='WAITING'; run.waitingOn=w.id;
      note(r,`execution paused — waiting for a ${d.label.toLowerCase()}`, run.resumed?'system':S.me);
      render();
      toast(`Paused — waiting for ${t.config.signerRole||'someone'} to sign`);
      return;
    }

    /* After a resume nobody is holding the request open, so the run continues
       under the system identity, on behalf of the requester. */
    const actor = run.resumed
      ? {by:'system', onBehalfOf:r.requester, triggeredBy:run.triggeredBy}
      : {by:run.startedBy};
    const ok = await runOneTask(r,t,actor);
    if(!ok && S.definition.onError==='STOP'){
      run.state='FAILED'; run.finishedAt=stamp();
      render(); toast('Run stopped after a failure — remaining tasks left untouched');
      return;
    }
    run.cursor++;
  }
  run.state = r.taskItems.every(t=>t.status==='SUCCEEDED') ? 'COMPLETED' : 'FAILED';
  run.finishedAt=stamp();
  render();
  toast(run.state==='COMPLETED'?'All tasks completed':'Run finished with failures');
}

async function completeWorkItem(id,result){
  const r=req();
  const w=r.workItems.find(x=>x.id===id); if(!w||w.state!=='OPEN') return;
  const t=r.taskItems.find(x=>x.id===w.taskItemId);
  const d=TASK_DEFS[t.def];
  w.state='COMPLETED'; w.result=result; w.completedBy=S.me; w.completedAt=stamp();
  t.status='SUCCEEDED'; t.error=null; t.attempts++; t.outputs=result;
  r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), by:S.me, outcome:'SUCCEEDED', ms:0,
    detail:`${d.label} completed by ${USERS[S.me].name}.\n`
         + Object.entries(result).filter(([,v])=>v).map(([k,v])=>`  ${k}: ${v}`).join('\n')});
  note(r,`signed "${w.title}" — execution continues`);
  r.run.cursor++; r.run.waitingOn=null;
  r.run.resumed=true; r.run.triggeredBy=S.me;
  closeModal(); render(); toast('Signed — execution continues');
  await driveRun(r);
}

function rejectWorkItem(id,reason){
  const r=req();
  const w=r.workItems.find(x=>x.id===id); if(!w||w.state!=='OPEN') return;
  const t=r.taskItems.find(x=>x.id===w.taskItemId);
  const d=TASK_DEFS[t.def];
  w.state='REJECTED'; w.rejectionReason=reason; w.completedBy=S.me; w.completedAt=stamp();
  t.status='FAILED'; t.error=`Signature refused: ${reason}`; t.attempts++;
  r.logs.push({taskId:t.id, attempt:t.attempts, at:stamp(), by:S.me, outcome:'FAILED', ms:0,
    detail:`${d.label} refused by ${USERS[S.me].name}.\n  reason: ${reason}`});
  note(r,`refused to sign "${w.title}"`);
  r.run.waitingOn=null;
  if(S.definition.onError==='STOP'){
    r.run.state='FAILED'; r.run.finishedAt=stamp();
    closeModal(); render(); toast('Signature refused — the run stopped here');
  }else{
    r.run.cursor++; r.run.resumed=true; r.run.triggeredBy=S.me;
    closeModal(); render(); driveRun(r);
  }
}

/* Ad-hoc dispatch of one task, outside a run. Deliberately still clickable when
   the gate is red, so the server refusing it stays visible. */
async function runSingle(id){
  const r=req();
  const t=r.taskItems.find(x=>x.id===id); if(!t) return;
  if(TASK_DEFS[t.def].manual){ toast('A manual task is closed by its signer, not dispatched'); return; }
  const gate=evaluateGate(r);
  if(!gate.canExecute){
    S.gateOpen=true; render();
    toast('The server refused: rules are not satisfied'); return;
  }
  await runOneTask(r,t,{by:S.me});
}

function cancelRun(){
  const r=req(); if(!runInFlight(r)) return;
  openWorkItems(r).forEach(w=>{ w.state='CANCELLED'; });
  r.taskItems.filter(t=>t.status==='WAITING').forEach(t=>{ t.status='NOT_RUN'; });
  r.run.state='CANCELLED'; r.run.finishedAt=stamp();
  note(r,'cancelled the execution run');
  render(); toast('Run cancelled — the request is editable again');
}

/* ============================ events ============================ */
document.addEventListener('click', e=>{
  if(S.tipOpen && !e.target.closest('.tipwrap')){
    S.tipOpen=false; $('#tip').innerHTML=''; $('#tipbtn').setAttribute('aria-expanded','false');
  }
  const scrim = e.target.closest('[data-scrim]');
  if(scrim && e.target===scrim){ closeModal(); return; }

  const av = e.target.closest('[data-user]');
  if(av){ S.me=av.dataset.user; render(); toast(`Now viewing as ${USERS[S.me].name}`); return; }

  const nav = e.target.closest('[data-nav]');
  if(nav){ S.screen = nav.dataset.nav==='inbox'?'inbox':'definition'; render(); return; }

  const openRow = e.target.closest('[data-open]');
  if(openRow){ S.openRequestId=openRow.dataset.open; S.screen='request'; S.requestTab='tasks'; render(); return; }

  const tab = e.target.closest('[data-tab]');
  if(tab){ S.inboxTab=tab.dataset.tab; render(); return; }
  const rtab = e.target.closest('[data-rtab]');
  if(rtab){ S.requestTab=rtab.dataset.rtab; render(); return; }
  const dsec = e.target.closest('[data-def]');
  if(dsec && dsec.dataset.act===undefined && dsec.hasAttribute('data-def') && dsec.tagName==='BUTTON' && !dsec.dataset.act){
    if(dsec.closest('.sidenav')){ S.defSection=dsec.dataset.def; render(); return; }
  }

  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.dataset.act;
  const r = req();

  switch(act){
    case 'toggle-tip': S.tipOpen=!S.tipOpen; S.tipSeen=true; render(); break;
    case 'toggle-gate': S.gateOpen=!S.gateOpen; render(); break;
    case 'back': case 'back-inbox': S.screen='inbox'; render(); break;
    case 'close': closeModal(); break;
    case 'save': r.version++; render(); toast(`Saved — version ${r.version}`); break;

    case 'approve':   approve('APPROVED'); break;
    case 'reject':    approve('REJECTED'); break;
    case 'unapprove': unapprove(); break;

    case 'toggle-cr':{
      const c=r.changeRequests.find(x=>x.id===btn.dataset.id);
      c.resolved=!c.resolved;
      note(r, c.resolved?'resolved a change request':'reopened a change request');
      render(); toast(c.resolved?'Marked resolved':'Reopened'); break;
    }
    case 'post-comment': case 'post-cr':{
      const ta=$('#composer'); const text=(ta?.value||'').trim();
      if(!text){ toast('Write something first'); ta?.focus(); break; }
      if(act==='post-comment'){
        r.comments.push({id:'c'+(++S.seq), user:S.me, text, at:stamp()});
        note(r,'commented');
      }else{
        r.changeRequests.push({id:'cr'+(++S.seq), user:S.me, text, resolved:false, at:stamp()});
        note(r,'requested a change');
      }
      render(); toast(act==='post-cr'?'Change requested':'Comment added'); break;
    }

    case 'add-task':    dlgAddTask(); break;
    case 'pick-task':   dlgConfigTask(btn.dataset.def, null); break;
    case 'config-task':{
      const t=r.taskItems.find(x=>x.id===btn.dataset.id);
      dlgConfigTask(t.def, t.id); break;
    }
    case 'save-task':{
      const defName=btn.dataset.def, id=btn.dataset.id;
      const def=TASK_DEFS[defName]; const cfg={};
      let missing=null;
      document.querySelectorAll('#modal [data-p]').forEach(el=>{
        cfg[el.dataset.p]=el.value.trim();
      });
      def.params.forEach(p=>{ if(p.required && !cfg[p.name]) missing=missing||p.label; });
      if(missing){ toast(`${missing} is required`); break; }
      if(id){
        const t=r.taskItems.find(x=>x.id===id);
        const before=taskConfigHash(r.taskItems);
        t.config=cfg;
        const after=taskConfigHash(r.taskItems);
        if(before!==after){
          if(t.status!=='NOT_RUN'){ t.status='NOT_RUN'; t.error=null; }
          const dismissed=r.approvals.filter(a=>a.hash===before).length;
          note(r,`changed the ${def.label} task configuration`);
          if(dismissed) toast(`${dismissed} approval(s) dismissed — the task changed`);
          else toast('Task updated');
        }
      }else{
        r.taskItems.push({id:'ti'+(++S.seq), def:defName, status:'NOT_RUN', attempts:0, config:cfg});
        note(r,`added a ${def.label} task`);
        toast('Task added');
      }
      r.version++;
      closeModal(); render(); break;
    }
    case 'del-task':{
      r.taskItems=r.taskItems.filter(t=>t.id!==btn.dataset.id);
      r.logs=r.logs.filter(l=>l.taskId!==btn.dataset.id);
      note(r,'removed a task'); r.version++;
      render(); toast('Task removed'); break;
    }
    case 'show-log': dlgLog(btn.dataset.id); break;

    case 'run-all': startRun(); break;
    case 'run-one': runSingle(btn.dataset.id); break;
    case 'cancel-run': cancelRun(); break;
    case 'sign': dlgSign(btn.dataset.id); break;
    case 'do-sign': case 'do-refuse':{
      const w=r.workItems.find(x=>x.id===btn.dataset.id);
      const def=TASK_DEFS[r.taskItems.find(t=>t.id===w.taskItemId).def];
      const result={};
      document.querySelectorAll('#modal [data-p]').forEach(el=>{ result[el.dataset.p]=el.value.trim(); });
      if(act==='do-refuse'){
        if(!result.note){ toast('Refusing needs a reason — use the Note field'); break; }
        rejectWorkItem(w.id, result.note); break;
      }
      let missing=null;
      def.resultParams.forEach(p=>{ if(p.required && !result[p.name]) missing=missing||p.label; });
      if(missing){ toast(`${missing} is required`); break; }
      completeWorkItem(w.id, result); break;
    }

    case 'new-request': dlgNewRequest(); break;
    case 'create-request':{
      const name=($('#nr-name')?.value||'').trim();
      if(!name){ toast('Give the request a title'); break; }
      const id='TR-'+(1043+S.seq);
      const data={}; S.definition.dataParameters.forEach(p=>data[p.name]=p.defaultValue);
      S.requests.unshift({
        id, name, requester:S.me, status:'OPEN', createdAt:stamp(), version:1,
        data, taskItems:[], approvals:[], changeRequests:[], comments:[], logs:[],
        workItems:[], run:null,
        history:[{at:stamp(), who:S.me, text:`created this request from ${S.definition.name}`}],
      });
      S.seq++; S.openRequestId=id; S.screen='request'; S.requestTab='tasks';
      closeModal(); render(); toast('Request created — add a task next'); break;
    }

    case 'toggle-onerror':
      S.definition.onError = S.definition.onError==='STOP'?'CONTINUE':'STOP';
      render(); break;
  }
});

document.addEventListener('change', e=>{
  const el=e.target; const act=el.dataset.act; if(!act) return;
  const r=req();
  if(act==='data-bool'){ r.data[el.dataset.name]=el.checked; r.version++; render(); return; }
  if(act==='transition'){
    const to=el.value; if(!to) return;
    r.status=to; note(r,`moved this request to ${to}`); r.version++;
    render(); toast(`Moved to ${to}`); return;
  }
  if(act==='rule-min'){
    const v=Math.max(1,Math.min(3,parseInt(el.value||'1',10)));
    S.definition.rules[+el.dataset.i].min=v; render(); return;
  }
  if(act==='rule-excl'){
    S.definition.rules[+el.dataset.i].excludeRequester=el.checked; render(); return;
  }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.act==='data-text'){ req().data[el.dataset.name]=el.value; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); if(S.tipOpen){ S.tipOpen=false; render(); } }
  const row=e.target.closest?.('[data-open]');
  if(row && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); row.click(); }
});

$('#themebtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
});
$('#resetbtn').addEventListener('click',()=>{ S=seed(); render(); toast('Prototype reset'); });

/* ---- seed the two pre-existing approvals against the current hash ---- */
S = seed();
(function fixSeedHashes(){
  S.requests.forEach(r=>{
    const h=taskConfigHash(r.taskItems);
    r.approvals.forEach(a=>{ if(a.hash===null) a.hash=h; });
  });
})();
render();
</script>
